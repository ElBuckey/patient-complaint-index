<header><h1>EMS Scenario Generator</h1><p>Practice medical decision-making without seeing the answer first</p><nav class="top-nav"><a href="index.html">Clinical Assistant</a><a href="scenario-generator.html" class="active">Scenario Generator</a></nav></header>
<div class="container">

<h2>Scenario Setup</h2>
<div class="controls">
<div><label for="type">Scenario Type</label><select id="type"><option value="Random">Random</option><option value="Medical">Medical</option><option value="Trauma">Trauma</option><option value="Environmental">Environmental</option><option value="Toxicology">Toxicology</option></select></div>
<div class="difficulty-control"><label>Difficulty <span class="label-note">(select one or more)</span></label><div id="difficultyOptions" class="multi-check"><label><input class="difficulty-check" type="checkbox" value="Basic" checked> Basic</label><label><input class="difficulty-check" type="checkbox" value="Advanced EMT" checked> Advanced EMT</label><label><input class="difficulty-check" type="checkbox" value="Paramedic" checked> Paramedic</label><label><input class="difficulty-check" type="checkbox" value="Critical Care Paramedic" checked> Critical Care Paramedic</label></div><div class="multi-actions"><button type="button" id="selectAllDifficulty">SELECT ALL</button><button type="button" id="clearDifficulty">CLEAR</button></div></div>
<div><label for="patient">Patient</label><select id="patient"><option value="Adult">Adult</option><option value="Geriatric">Geriatric</option></select></div>
<div><label for="progression">Progression</label><select id="progression"><option value="Static">Static</option><option value="Dynamic">Dynamic</option></select></div>
<div><label for="mode">Mode</label><select id="mode"><option value="Student">Student</option><option value="FTO">FTO</option></select></div>
<div><label for="scenarioFormat">Format</label><select id="scenarioFormat"><option value="Single">Single Patient</option><option value="MCI">MCI - Multiple Patients</option></select></div>
<div id="patientCountWrap" style="display:none"><label for="patientCount">MCI Patient Count</label><select id="patientCount"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></div>
<div id="specificWrap" style="display:none"><label for="specific">Specific Scenario</label><select id="specific"><option value="Random">Random</option></select></div>
</div>
</div>
<button id="generate" class="generate" type="button">GENERATE SCENARIO</button>
<div id="scenario" class="scenario section"></div>

function fill(t,p){return (t||"").replaceAll("{age}",p.age).replaceAll("{sex}",p.sex);}
function plain(t){
 let x=t||"";
 const reps=[
  [/Airway is patent\.?/gi,'There is no obvious blockage in the airway.'],
  [/airway is patent/gi,'there is no obvious blockage in the airway'],
  [/patent airway/gi,'open airway with no obvious blockage'],
  [/radial pulse/gi,'pulse at the wrist'],
  [/respirations/gi,'breathing'],
  [/diaphoresis/gi,'heavy sweating'],
  [/diaphoretic/gi,'sweaty'],
  [/cyanosis/gi,'bluish skin discoloration'],
  [/altered mental status/gi,'change in alertness / confusion'],
  [/hypotensive/gi,'with low blood pressure'],
  [/tachypneic/gi,'breathing fast'],
  [/tachycardic/gi,'with a fast heart rate'],
  [/bradycardic/gi,'with a slow heart rate']
 ];
 reps.forEach(([a,b])=>x=x.replace(a,b)); return x;
}
function classifyVital(kind,val1,val2){
 const n=Number(val1); if(!Number.isFinite(n))return '';
 if(kind==='HR') return n<60?'LOW':n>100?'HIGH':'NORMAL';
 if(kind==='BP'){const d=Number(val2);return n<90?'LOW':(n>140||d>90)?'HIGH':'NORMAL';}
 if(kind==='RR') return n<12?'LOW':n>20?'HIGH':'NORMAL';
 if(kind==='SpO₂') return n<95?'LOW':'NORMAL';
 if(kind==='Temp') return n<95?'LOW':n>100.4?'HIGH':'NORMAL';
 if(kind==='BGL') return n<70?'LOW':n>140?'HIGH':'NORMAL';
 if(kind==='EtCO₂') return n<35?'LOW':n>45?'HIGH':'NORMAL';
 return '';
}
function annotateVitals(t){
 let x=t||'';
 x=x.replace(/\bHR\s+(\d+)/g,(m,a)=>`${m} (${classifyVital('HR',a)})`);
 x=x.replace(/\bBP\s+(\d+)\/(\d+)/g,(m,a,b)=>`${m} (${classifyVital('BP',a,b)})`);
 x=x.replace(/\bRR\s+(\d+)/g,(m,a)=>`${m} (${classifyVital('RR',a)})`);
 x=x.replace(/\bSpO₂\s+(\d+)%/g,(m,a)=>`${m} (${classifyVital('SpO₂',a)})`);
 x=x.replace(/\bTemp\s+(\d+(?:\.\d+)?)°F/g,(m,a)=>`${m} (${classifyVital('Temp',a)})`);
 x=x.replace(/\bBGL\s+(\d+)\s*mg\/dL/g,(m,a)=>`${m} (${classifyVital('BGL',a)})`);
 x=x.replace(/\bEtCO₂\s+(\d+)/g,(m,a)=>`${m} (${classifyVital('EtCO₂',a)})`);
 return x;
}
function present(t,p){return annotateVitals(plain(fill(t,p)));}
function card(title,text,cls=""){return `<div class="card ${cls}"><h3>${title}</h3><p>${text}</p></div>`}

function selectedDifficulties(){return [...document.querySelectorAll('.difficulty-check:checked')].map(x=>x.value);}
function focusFor(s){
 const c=s.condition;
 if(c.includes('Asthma'))return 'Asthma';
 if(c.includes('Burn'))return 'Burns';
 if(c.includes('Stab'))return 'Stab Wounds / Impalements';
 if(c.includes('Impalement'))return 'Stab Wounds / Impalements';
 if(c.includes('Animal Attack'))return 'Animal Attacks';
 if(c.includes('Seizure'))return 'Seizures';
 if(c.includes('SVT'))return 'SVT';
 if(c.includes('Atrial Fibrillation'))return 'A-Fib RVR';
 if(c.includes('V-Tach')||c.includes('Ventricular Tachycardia'))return c.includes('Polymorphic')?'Polymorphic V-Tach':'V-Tach with Pulse';
 if(c.includes('Cardiac Arrest'))return c.includes('Non-Shockable')?'Non-Shockable Cardiac Arrest':'Shockable Cardiac Arrest';
 if(c.includes('Bradycardia'))return c.includes('Pacing')?'Bradycardia / Pacing':'Bradycardia';
 if(c.includes('ACS / Heart Attack'))return 'Heart Attack / ACS';
 if(c.includes('Major External Bleeding'))return 'Major External Bleeding';
 if(c.includes('Catastrophic Hemorrhage'))return 'Catastrophic Hemorrhage';
 if(c.includes('SWiFT'))return 'Massive Hemorrhage / SWiFT';
 return c;
}
function updateSpecificOptions(){

 if($("mode").value!=="FTO"){wrap.style.display="none";sel.innerHTML='<option value="Random">Random</option>';return;}
 wrap.style.display="block";
 const type=$("type").value,diffs=selectedDifficulties();
 const eligible=scenarios.filter(s=>diffs.includes(s.difficulty)&&(type==="Random"||s.type===type));
 const focuses=[...new Set(eligible.map(focusFor))].sort((a,b)=>a.localeCompare(b));
 const previous=sel.value;
 sel.innerHTML='<option value="Random">Random</option>'+focuses.map(f=>`<option value="${f}">${f}</option>`).join('');
 if(focuses.includes(previous))sel.value=previous;
}

 groups.unshift(['Initial ABCDE / Vitals']);

 groups.forEach(g=>{const k=g.join('|');if(!seen.has(k)){seen.add(k);dedupeGroups.push(g)}});
 return {criticalGroups:dedupeGroups,beneficial:[...new Set(src.beneficial||[])],neutral:[...new Set(src.neutral||[])],harmful:[...new Set(src.harmful||[])]};
}

function timingRules(s,rules){
 const d=(s.diagnosis||s.condition).toLowerCase();
 const req=(seconds,groups,label,stage)=>({seconds,requiredGroups:groups,label,stage});
 if(d.includes('major external hemorrhage')||d.includes('animal attack'))return[req(120,[['Tourniquet']], 'Control life-threatening extremity bleeding',1),req(240,[['Tourniquet']], 'Hemorrhage remains uncontrolled',2)];
 if(d.includes('open chest wound')||d.includes('sucking chest'))return[req(120,[['Chest Seal']], 'Seal the open chest wound',1),req(240,[['Chest Seal']], 'Open chest injury remains untreated',2)];
 if(d.includes('anaphyl'))return[req(120,[['Epinephrine (IM - Anaphylaxis)']], 'Give IM Epinephrine',1),req(240,[['Epinephrine (IM - Anaphylaxis)']], 'Anaphylaxis remains untreated',2)];
 if(d.includes('opioid'))return[req(90,[['BVM Ventilation']], 'Support ventilation',1),req(180,[['BVM Ventilation'],['Naloxone']], 'Ventilatory failure continues',2)];
 if(d.includes('tension pneumothorax'))return[req(120,[['DART (Chest Decompression)']], 'Perform DART (Chest Decompression)',1),req(240,[['DART (Chest Decompression)']], 'Tension physiology continues',2)];
 if(d.includes('hypogly'))return[req(180,[['Oral Glucose','IV Dextrose']], 'Correct low blood sugar',1),req(300,[['Oral Glucose','IV Dextrose']], 'Low blood sugar remains untreated',2)];
 if(d.includes('asthma')){
  const a=[req(180,[['Albuterol'],['Ipratropium']], 'Begin bronchodilator treatment',1)];
  if(s.difficulty==='Critical Care Paramedic')a.push(req(300,[['Magnesium Sulphate']], 'Escalate refractory asthma treatment',2));return a;
 }
 if(d.includes('shockable cardiac arrest'))return[req(60,[['CPR'],['Defibrillation / AED Shock']], 'Begin CPR and shock the shockable rhythm',1),req(180,[['CPR'],['Defibrillation / AED Shock']], 'Shockable arrest continues',2)];
 if(d.includes('non-shockable cardiac arrest'))return[req(60,[['CPR']], 'Begin/continue CPR',1),req(180,[['IV / IO Access'],['Epinephrine (Cardiac Arrest)']], 'Continue non-shockable arrest pathway',2)];
 if(d.includes('synchronized')||d.includes('unstable supraventricular')||d.includes('unstable atrial')||d.includes('unstable ventricular tachycardia'))return[req(120,[['Synchronized Cardioversion']], 'Treat unstable tachyarrhythmia',1),req(240,[['Synchronized Cardioversion']], 'Unstable tachyarrhythmia persists',2)];
 if(d.includes('pacing'))return[req(120,[['Transcutaneous Pacing']], 'Begin Transcutaneous Pacing',1),req(240,[['Transcutaneous Pacing']], 'Poor perfusion from bradycardia continues',2)];
 if(d.includes('swift'))return[req(90,[['Tourniquet']], 'Stop the bleeding',1),req(240,[['IV / IO Access'],['Tranexamic Acid (TXA)']], 'Complete IV / TXA phase',1),req(420,[['Lyophilised Plasma'],['Packed Red Blood Cells'],['Calcium Chloride']], 'Complete SWiFT blood-product phase',2)];
 const nonAbcde=rules.criticalGroups.filter(g=>!g.includes('Initial ABCDE / Vitals'));
 if(nonAbcde.length&&(s.stages||[]).length)return[req(180,nonAbcde,'Complete critical interventions',1),req(360,nonAbcde,'Critical problem remains untreated',2)];
 return [];
}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function renderTreatmentPanel(out,s,p,progression){
 const groups=treatmentGroupsFor(s.difficulty),available=Object.values(groups).flat(),rules=treatmentRules(s),deadlines=progression==='Dynamic'?timingRules(s,rules):[];
 const criticalGroups=rules.criticalGroups.map(g=>g.filter(t=>available.includes(t))).filter(g=>g.length),beneficial=rules.beneficial.filter(t=>available.includes(t));
 const completed=new Map();let elapsed=0,running=false,lastTick=null,timerId=null,currentStage=0,reassessCount=0;const id=uid('tx');
 const labels=criticalGroups.map(g=>g.join(' OR '));
 const deadlineForGroup=g=>{const x=deadlines.find(d=>d.requiredGroups.some(r=>r.some(t=>g.includes(t))));return x?fmtTime(x.seconds):''};
 out.insertAdjacentHTML('beforeend',`<div class="card fto-actions"><div class="fto-private">FTO QUICK REFERENCE — DO NOT SHOW STUDENT</div><h3>Trainee Expected Actions</h3><div class="action-groups"><div class="action-group action-critical"><h4>Critical / Must Address</h4>${criticalGroups.map(g=>`<div class="action-item"><span>${g.join(' OR ')}</span>${deadlineForGroup(g)?`<span class="action-deadline">by ${deadlineForGroup(g)}</span>`:''}</div>`).join('')}</div><div class="action-group action-expected"><h4>Expected / Beneficial</h4>${beneficial.length?beneficial.map(t=>`<div class="action-item"><span>${t}</span></div>`).join(''):'<div class="private-note">No additional beneficial treatment is required beyond the critical actions.</div>'}</div></div>${deadlines.length?'<div class="timer-help">Dynamic deadlines are simulation pacing rules, not clinical protocol time limits.</div>':''}</div><div id="${id}" class="treatment-panel"><h3>FTO Dynamic Control</h3><div class="sim-header"><div class="sim-clock"><div class="sim-clock-label">SCENARIO TIME</div><div class="sim-time">00:00</div><div class="sim-status">Paused</div><div class="sim-controls"><button type="button" class="timer-start primary">START</button><button type="button" class="timer-pause">PAUSE</button><button type="button" class="timer-add">+30 SEC</button><button type="button" class="timer-reset">RESET</button></div></div><div class="patient-state"><span class="stage-indicator">STAGE 1</span><h4>Current Patient Presentation</h4><div class="state-text">${present(s.initial,p)} ${present(s.vitals,p)}</div><div class="deadline-area"></div></div></div><p>Select an action <strong>when the trainee actually performs or verbalizes it</strong>. The exact scenario time is recorded immediately.</p><div class="treatment-grid">${renderTreatmentGroups(groups,'treatment-btn')}</div><button type="button" class="reassess-btn secondary">REASSESS PATIENT NOW</button><div class="current-response"></div><div class="timeline"><div class="timeline-title">Scenario Timeline / Debrief Log</div><div class="timeline-list"><div class="timeline-entry"><span class="timeline-time">00:00</span><span class="timeline-text">Scenario loaded — timer paused.</span></div></div></div></div>`);
 const panel=document.getElementById(id),timeEl=panel.querySelector('.sim-time'),statusEl=panel.querySelector('.sim-status'),stageBadge=panel.querySelector('.stage-indicator'),stateText=panel.querySelector('.state-text'),deadlineArea=panel.querySelector('.deadline-area'),timeline=panel.querySelector('.timeline-list'),resp=panel.querySelector('.current-response');
 const selectedSet=()=>new Set(completed.keys());const groupsMet=gs=>gs.every(g=>groupSatisfied(g,selectedSet()));
 const logEvent=(text,cls='')=>{timeline.insertAdjacentHTML('beforeend',`<div class="timeline-entry ${cls}"><span class="timeline-time">${fmtTime(elapsed)}</span><span class="timeline-text">${text}</span></div>`);timeline.parentElement.scrollTop=timeline.parentElement.scrollHeight;};
 const updateClock=()=>{timeEl.textContent=fmtTime(elapsed);statusEl.textContent=running?'Running':'Paused'};
 const applyStage=(n,reason)=>{if(n<=currentStage)return;currentStage=n;const st=(s.stages||[])[Math.min(n-1,(s.stages||[]).length-1)];stageBadge.textContent=`STAGE ${n+1}`;stageBadge.className=`stage-indicator ${n===1?'stage2':'stage3'}`;const text=st?present(st.text,p):'The patient continues to deteriorate because a critical problem remains untreated.';stateText.textContent=text;logEvent(`${st?st.title:`Stage ${n+1}`}: ${reason} ${text}`,'warn');resp.innerHTML=`<div class="card response-card worse"><h3>AUTOMATIC PROGRESSION — STAGE ${n+1}</h3><p>${text}</p></div>`;};
 const evaluateDeadlines=()=>{let next=null;deadlines.forEach(d=>{if(elapsed>=d.seconds&&!groupsMet(d.requiredGroups)){if(!next||d.stage>next.stage)next=d}});if(next){deadlineArea.innerHTML=`<div class="deadline-banner">⚠ Missed timed action: <strong>${next.label}</strong> by ${fmtTime(next.seconds)}</div>`;applyStage(next.stage,`Timed critical action missed (${next.label}).`)}else{const future=deadlines.filter(d=>elapsed<d.seconds&&!groupsMet(d.requiredGroups)).sort((a,b)=>a.seconds-b.seconds)[0];deadlineArea.innerHTML=future?`<div class="private-note">Next timed checkpoint: <strong>${future.label}</strong> by ${fmtTime(future.seconds)}</div>`:''}};
 const tick=()=>{if(!running)return;const now=Date.now();elapsed+=(now-lastTick)/1000;lastTick=now;updateClock();evaluateDeadlines();timerId=setTimeout(tick,250)};
 const start=()=>{if(running)return;running=true;lastTick=Date.now();updateClock();logEvent('Scenario timer started.');tick()};
 const pause=()=>{if(!running)return;running=false;if(timerId)clearTimeout(timerId);updateClock();logEvent('Scenario timer paused.')};
 panel.querySelector('.timer-start').addEventListener('click',start);panel.querySelector('.timer-pause').addEventListener('click',pause);panel.querySelector('.timer-add').addEventListener('click',()=>{elapsed+=30;updateClock();logEvent('FTO advanced simulation clock by 30 seconds.');evaluateDeadlines()});
 panel.querySelector('.timer-reset').addEventListener('click',()=>{pause();elapsed=0;currentStage=0;completed.clear();panel.querySelectorAll('.treatment-btn').forEach(b=>b.classList.remove('done','harmful-picked'));stageBadge.textContent='STAGE 1';stageBadge.className='stage-indicator';stateText.textContent=`${present(s.initial,p)} ${present(s.vitals,p)}`;deadlineArea.innerHTML='';resp.innerHTML='';timeline.innerHTML='<div class="timeline-entry"><span class="timeline-time">00:00</span><span class="timeline-text">Scenario reset.</span></div>';updateClock();evaluateDeadlines()});
 panel.querySelectorAll('.treatment-btn').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.tx;if(completed.has(t))return;completed.set(t,elapsed);b.classList.add('done');if(rules.harmful.includes(t)){b.classList.add('harmful-picked');logEvent(`${t} performed — incorrect / harmful for this scenario.`,'warn');resp.innerHTML='<div class="card response-card worse"><h3>NEGATIVE RESPONSE</h3><p>The patient receives no benefit or may worsen after the inappropriate intervention. Reassess and correct the treatment plan.</p></div>'}else if(rules.beneficial.includes(t)||criticalGroups.some(g=>g.includes(t)))logEvent(`${t} performed.`,'good');else logEvent(`${t} performed — acceptable / neutral.`);evaluateDeadlines()}));
 panel.querySelector('.reassess-btn').addEventListener('click',()=>{reassessCount++;const criticalMet=criticalGroups.every(g=>groupSatisfied(g,selectedSet())),harmful=[...completed.keys()].filter(t=>rules.harmful.includes(t)),good=[...completed.keys()].filter(t=>rules.beneficial.includes(t)||criticalGroups.some(g=>g.includes(t)));let status='stable',title='UNCHANGED',text='The patient remains largely unchanged. Continue assessment and address the underlying problem.';if(harmful.length){status='worse';title='DETERIORATING';text='An incorrect or harmful intervention has contributed to a worse clinical course.'}else if(criticalMet){status='improved';title='IMPROVING / STABILIZING';text=currentStage>0?'The critical problems are now being addressed. Further deterioration slows or stops, but prior losses do not instantly reverse.':'The patient shows an appropriate favorable response to treatment. Continue monitoring and reassessment.'}else{status='worse';title='DETERIORATING';text='One or more critical problems remain untreated.'}const missing=criticalGroups.filter(g=>!groupSatisfied(g,selectedSet())).map(g=>g.join(' OR '));resp.innerHTML=`<div class="card response-card ${status}"><h3>Reassessment ${reassessCount}: ${title}</h3><p>${text}</p><div class="private-note"><strong>Critical actions:</strong> ${criticalMet?'Completed':'Still missing: '+missing.join('; ')}<br><strong>Completed actions:</strong> ${[...completed.entries()].map(([t,tm])=>`${t} (${fmtTime(tm)})`).join(', ')||'None'}</div></div>`;logEvent(`Patient reassessed — ${title}.`,status==='improved'?'good':status==='worse'?'warn':'')});
 updateClock();evaluateDeadlines();
}
function renderStudent(out,s,p,progression){

function renderPatientBlock(parent,s,p,progression,mode,title,showScene=true){

function chooseUnique(pool,count){const copy=[...pool],out=[];while(out.length<count&&copy.length){const i=Math.floor(Math.random()*copy.length);out.push(copy.splice(i,1)[0])}while(out.length<count&&pool.length)out.push(rnd(pool));return out;}
function generate(){

 if(format==='Single'){
  const pool=singlePool(type,diffs,specific);if(!pool.length){out.innerHTML='<h2>Scenario</h2><div class="empty">There are no matching scenarios for those selections.</div>';return}const s=rnd(pool),p=patientData(patient),difficultyBadge=mode==='FTO'?`<span class="badge">${s.difficulty}</span>`:'';out.innerHTML=`<h2>${mode==='FTO'?'FTO Scenario':'Student Scenario'}</h2><div class="meta"><span class="badge">${s.type}</span>${difficultyBadge}<span class="badge">${patient}: ${p.age}</span><span class="badge">${progression}</span><span class="badge">${mode} Mode</span></div>`;out.innerHTML+=card('Dispatch',present(s.dispatch,p),'dispatch')+card('Scene',present(s.scene,p),'scene');if(mode==='FTO')renderFTO(out,s,p,progression);else renderStudent(out,s,p,progression);return;
 }
 const count=Number($("patientCount").value)||3;let mciType=type;if(mciType==='Random'){const types=[...new Set(scenarios.filter(s=>diffs.includes(s.difficulty)).map(s=>s.type))];mciType=rnd(types)}let pool=singlePool(mciType,diffs,specific);if(!pool.length){out.innerHTML='<h2>MCI Scenario</h2><div class="empty">There are no matching patients for this MCI setup. Try Random Specific Scenario or another type / difficulty combination.</div>';return}const picks=chooseUnique(pool,count);out.innerHTML=`<h2>${mode==='FTO'?'FTO MCI Scenario':'Student MCI Scenario'}</h2>${card('MCI Dispatch',mciIntro(mciType,count),'mci-header')}<div class="meta"><span class="badge">${mciType} MCI</span><span class="badge">${count} Patients</span><span class="badge">${progression}</span><span class="badge">${mode} Mode</span></div>`;picks.forEach((s,i)=>renderPatientBlock(out,s,patientData(patient),progression,mode,`Patient ${i+1}`,false));
}
