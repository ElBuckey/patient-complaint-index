function focusFor(s){
 const c=s.condition;
 if(c.includes("Asthma")) return "Asthma";
 if(c.includes("Burn")) return "Burns";
 if(c==="SVT") return "SVT";
 if(c.includes("Atrial Fibrillation")) return "A-Fib RVR";
 if(c==="Ventricular Tachycardia") return "V-Tach";
 if(c.includes("Ventricular Fibrillation")) return "V-Fib / Cardiac Arrest";
 if(c.includes("Bradycardia")) return "Bradycardia";
 if(c.includes("ACS / Heart Attack")) return "Heart Attack / ACS";
 if(c.includes("Pneumothorax")) return c;
 if(c.includes("Hemorrhage") || c.includes("Bleeding")) return c;
 return c;
}
function updateSpecificOptions(){

 const type=$("type").value,difficulty=$("difficulty").value;
 const eligible=scenarios.filter(s=>s.difficulty===difficulty && (type==="Random"||s.type===type));
 const focuses=[...new Set(eligible.map(focusFor))].sort((a,b)=>a.localeCompare(b));
 const previous=sel.value;
 sel.innerHTML='<option value="Random">Random</option>'+focuses.map(f=>`<option value="${f}">${f}</option>`).join("");
 if(focuses.includes(previous)) sel.value=previous;
}

function treatmentProfile(s){
 const c=s.condition.toLowerCase(); let good=[],critical=[],harmful=[];
 const add=(arr,...x)=>arr.push(...x);
 if(c.includes('asthma')){add(good,'Oxygen','Albuterol / Ipratropium');add(critical,'Albuterol / Ipratropium'); if(s.difficulty==='Critical Care Paramedic')add(good,'Magnesium Sulfate');}
 if(c.includes('anaphyl')){add(good,'Oxygen','IM Epinephrine','IV / IO Access','Fluid Bolus');add(critical,'IM Epinephrine');}
 if(c.includes('hypogly')){add(good,'Check BGL','Oral Glucose','Oral / IV Dextrose','Check BGL / Dextrose');add(critical,'Check BGL');}
 if(c.includes('opioid')){add(good,'BVM Ventilation','Naloxone','Oxygen');add(critical,'BVM Ventilation');}
 if(c.includes('hemorrhage')||c.includes('bleeding')){add(good,'Bleeding Control / Pressure','Tourniquet','IV / IO Access','Fluid Bolus','TXA','Blood Products / SWiFT','Keep Warm / Prevent Heat Loss');add(critical,'Bleeding Control / Pressure');}
 if(c.includes('fracture'))add(good,'Splinting / Immobilization','Pain / Nausea Management');
 if(c.includes('drowning')){add(good,'Suction','Oxygen','BVM Ventilation','Keep Warm / Prevent Heat Loss');add(critical,'Oxygen');}
 if(c.includes('hypothermia')){add(good,'Keep Warm / Prevent Heat Loss','Oxygen');add(critical,'Keep Warm / Prevent Heat Loss');}
 if(c.includes('pneumothorax')){add(good,'Oxygen','Needle Decompression','Rapid Transport'); if(c.includes('tension'))add(critical,'Needle Decompression');}
 if(c.includes('burn')){add(good,'Oxygen','Keep Warm / Prevent Heat Loss','IV / IO Access','Advanced Airway / RSI','Rapid Transport');}
 if(c.includes('svt')||c.includes('atrial fibrillation')||c.includes('ventricular tachycardia')){add(good,'Cardiac Monitor / 12-Lead','IV / IO Access','Synchronized Cardioversion'); if((s.vitals||'').includes('BP 78')||c.includes('ventricular tachycardia'))add(critical,'Synchronized Cardioversion');}
 if(c.includes('bradycardia'))add(good,'Cardiac Monitor / 12-Lead','IV / IO Access','Atropine');
 if(c.includes('ventricular fibrillation')){add(good,'CPR / Defibrillation','IV / IO Access');add(critical,'CPR / Defibrillation');}
 if(c.includes('acs')||c.includes('heart attack'))add(good,'Cardiac Monitor / 12-Lead','Aspirin','IV / IO Access','Oxygen','Nitroglycerin');
 if(c.includes('massive hemorrhage requiring swift')){add(good,'Blood Products / SWiFT');add(critical,'Blood Products / SWiFT');}
 // Treatments that are particularly inappropriate in selected scenarios. Instructor judgment still controls grading.
 if(c.includes('hypogly'))add(harmful,'Nitroglycerin');
 if(c.includes('opioid'))add(harmful,'Nitroglycerin');
 return {good:[...new Set(good)],critical:[...new Set(critical)],harmful:[...new Set(harmful)]};
}
function renderTreatmentPanel(out,s,progression){
 const scope=treatmentScope[s.difficulty]||[]; const profile=treatmentProfile(s); const id='tx-'+Date.now();
 out.insertAdjacentHTML('beforeend',`<div class="card treatment-panel" id="${id}"><div class="fto-private">FTO CONTROL — DO NOT SHOW STUDENT</div><h3>Treatments / Interventions</h3><p>Select actions as the student performs or verbalizes them. Selections carry forward through reassessments.</p><div class="treatment-grid">${scope.map((t,i)=>`<label class="treatment-option"><input type="checkbox" value="${t}"> ${t}</label>`).join('')}</div><button class="reassess-btn" type="button">REASSESS PATIENT</button><div class="response-area"></div></div>`);
 const panel=document.getElementById(id),btn=panel.querySelector('.reassess-btn'),area=panel.querySelector('.response-area'); let step=0;
 btn.addEventListener('click',()=>{
   const selected=[...panel.querySelectorAll('input:checked')].map(x=>x.value); const has=x=>selected.includes(x);
   const criticalDone=profile.critical.length===0 || profile.critical.some(has); const beneficial=profile.good.filter(has); const harmful=profile.harmful.filter(has);
   let status='stable',title='Patient Remains Unchanged',text='No major improvement is seen yet. Continue assessment and treatment.';
   if(harmful.length){status='worse';title='Patient Deteriorates';text='The patient worsens after an inappropriate intervention. Reassess ABCs and correct the treatment plan.';}
   else if(criticalDone && beneficial.length){status='improved';title='Patient Improves / Stabilizes';text='The patient shows a clinically appropriate improvement after treatment. Continue monitoring and reassessment.';}
   else if(!criticalDone){status='worse';title='Patient Deteriorates'; if(progression==='Dynamic'&&s.stages&&s.stages.length){const st=s.stages[Math.min(step,s.stages.length-1)];text=st.text;step++;}else{text='A critical intervention has not been completed and the patient continues to worsen.';}}
   else if(progression==='Dynamic'&&s.stages&&s.stages.length && beneficial.length===0){status='worse';title='Patient Deteriorates';const st=s.stages[Math.min(step,s.stages.length-1)];text=st.text;step++;}
   area.innerHTML=`<div class="card response-card ${status}"><h3>${title}</h3><p>${text}</p><div class="fto-private" style="margin-top:12px">FTO FEEDBACK</div><ul class="detail-list"><li>Effective actions selected: ${beneficial.length?beneficial.join(', '):'None yet'}</li><li>Critical action status: ${criticalDone?'Completed / not required':'MISSING — '+profile.critical.join(' or ')}</li>${harmful.length?`<li>Potentially harmful action selected: ${harmful.join(', ')}</li>`:''}</ul><div class="treatment-history">Current documented actions: ${selected.length?selected.join(' • '):'None'}</div></div>`;
 });
}

 const out=$("scenario");out.style.display="block";
 if(!pool.length){out.innerHTML=`<h2>Scenario</h2><div class="empty">There are no matching scenarios in the current library for those selections. Choose Random or another type/difficulty/specific scenario.</div>`;return;}
 const s=rnd(pool),p=patientData(patient);out.innerHTML=`<h2>${mode==="FTO"?"FTO Scenario":"Student Scenario"}</h2><div class="meta"><span class="badge">${s.type}</span><span class="badge">${s.difficulty}</span><span class="badge">${patient}: ${p.age}</span><span class="badge">${progression}</span><span class="badge">${mode} Mode</span></div>`;
 out.innerHTML+=card("Dispatch",fill(s.dispatch,p),"dispatch")+card("Scene",fill(s.scene,p),"scene");

 "Paramedic":["Initial ABCDE / Vitals","Airway Positioning","Suction","OPA / NPA","Oxygen","BVM Ventilation","Advanced Airway / RSI","CPR / Defibrillation","Cardiac Monitor","12-Lead ECG","Synchronized Cardioversion","Stroke Assessment / LKW","Blood Glucose Check","IV / IO Access","IV Fluids","IV Dextrose","Naloxone","IM Epinephrine","Albuterol / Ipratropium","Nitroglycerin","Aspirin","Atropine","Epinephrine","Diazepam","Ketamine","Rocuronium","Ondansetron","Morphine","TXA","Needle Decompression","Direct Pressure / Dressing","Tourniquet","Neurovascular Check","Splinting","Warming / Cooling","Rapid Cooling","Gentle Handling / Prevent Heat Loss","Scene Safety / Remove from Source","Decontamination / PPE","Rapid Transport"],
 "Critical Care Paramedic":["Initial ABCDE / Vitals","Airway Positioning","Suction","Oxygen","BVM Ventilation","Advanced Airway / RSI","Ventilator Management","CPR / Defibrillation","Cardiac Monitor","12-Lead ECG","Synchronized Cardioversion","Stroke Assessment / LKW","IV / IO Access","IV Fluids","Blood Products / SWiFT","Stop Transfusion","IV Dextrose","Naloxone","IM Epinephrine","Albuterol / Ipratropium","Nitroglycerin","Aspirin","Atropine","Epinephrine","Fentanyl","Ketamine","Rocuronium","Magnesium","Calcium Chloride","Antibiotic","TXA","Needle Decompression","Open Thoracostomy / Surgical Airway","Direct Pressure / Dressing","Warming / Cooling","Rapid Cooling","Gentle Handling / Prevent Heat Loss","Scene Safety / Remove from Source","Decontamination / PPE","Rapid Transport"]
};
function treatmentRules(s){
 const d=(s.diagnosis||s.condition).toLowerCase();
 let beneficial=[],critical=[],harmful=[];
 const add=(arr,...x)=>x.forEach(v=>!arr.includes(v)&&arr.push(v));
 add(beneficial,"Initial ABCDE / Vitals","Rapid Transport");

 if(/hypogly/.test(d)){add(beneficial,"Blood Glucose Check","Oral Glucose","IV Dextrose");add(critical,"Blood Glucose Check","Oral Glucose","IV Dextrose");add(harmful,"Nitroglycerin");}
 if(/asthma/.test(d)){add(beneficial,"Oxygen","Albuterol / Ipratropium");add(critical,"Albuterol / Ipratropium");if(s.difficulty==="Critical Care Paramedic")add(beneficial,"Magnesium","BVM Ventilation","Advanced Airway / RSI","Ventilator Management");}
 if(/syncope|near syncope/.test(d)){add(beneficial,"Blood Glucose Check","Cardiac Monitor","Rapid Transport");add(critical,"Initial ABCDE / Vitals","Blood Glucose Check");}
 if(/pneumonia/.test(d)){add(beneficial,"Oxygen","Rapid Transport");add(critical,"Oxygen","Rapid Transport");}
 if(/alcohol intox/.test(d)){add(beneficial,"Airway Positioning","Blood Glucose Check","Rapid Transport");add(critical,"Blood Glucose Check");}
 if(/heat exhaustion/.test(d)){add(beneficial,"Warming / Cooling","Rapid Transport");add(critical,"Warming / Cooling");}
 if(/simple pneumothorax/.test(d)){add(beneficial,"Oxygen","Rapid Transport");add(critical,"Oxygen","Rapid Transport");}
 if(/anaphyl/.test(d)){add(beneficial,"Oxygen","IM Epinephrine","IV / IO Access","IV Fluids","BVM Ventilation");add(critical,"IM Epinephrine");}
 if(/copd/.test(d)){add(beneficial,"Oxygen","Albuterol / Ipratropium","BVM Ventilation");add(critical,"Albuterol / Ipratropium");}
 if(/upper gi bleed|variceal|gi bleed/.test(d)){add(beneficial,"Suction","IV / IO Access","IV Fluids","Warming / Cooling","Rapid Transport");add(critical,"Suction","IV / IO Access","Rapid Transport");add(harmful,"Nitroglycerin");}
 if(/hemothorax/.test(d)){add(beneficial,"Oxygen","IV / IO Access","IV Fluids","Warming / Cooling","Rapid Transport");add(critical,"Oxygen","Rapid Transport");add(harmful,"Nitroglycerin");}
 if(/carbon monoxide/.test(d)){add(beneficial,"Scene Safety / Remove from Source","Oxygen","Cardiac Monitor","Rapid Transport");add(critical,"Scene Safety / Remove from Source","Oxygen");}
 if(/opioid/.test(d)){add(beneficial,"Airway Positioning","Oxygen","BVM Ventilation","Naloxone");add(critical,"BVM Ventilation","Naloxone");}
 if(/acs|heart attack/.test(d)){add(beneficial,"12-Lead ECG","Aspirin","IV / IO Access","Nitroglycerin","Oxygen","Rapid Transport");add(critical,"12-Lead ECG","Aspirin");}
 if(/stroke/.test(d)){add(beneficial,"Stroke Assessment / LKW","Blood Glucose Check","Oxygen","Rapid Transport");add(critical,"Stroke Assessment / LKW","Blood Glucose Check","Rapid Transport");}
 if(/tension pneumothorax/.test(d)){add(beneficial,"Oxygen","Needle Decompression","Open Thoracostomy / Surgical Airway","Rapid Transport");add(critical,"Needle Decompression","Open Thoracostomy / Surgical Airway");}
 if(/cardiac tamponade/.test(d)){add(beneficial,"Oxygen","IV / IO Access","IV Fluids","Rapid Transport");add(critical,"Rapid Transport");}
 if(/dka|diabetic ketoacidosis/.test(d)){add(beneficial,"Blood Glucose Check","IV / IO Access","IV Fluids","Cardiac Monitor","Rapid Transport");add(critical,"IV / IO Access","IV Fluids");}
 if(/status epilepticus/.test(d)){add(beneficial,"Airway Positioning","Oxygen","BVM Ventilation","Blood Glucose Check","IV / IO Access","Diazepam");add(critical,"Diazepam","BVM Ventilation");}
 if(/pesticide|nerve agent/.test(d)){add(beneficial,"Scene Safety / Remove from Source","Decontamination / PPE","Suction","BVM Ventilation","Atropine","Rapid Transport");add(critical,"Decontamination / PPE","BVM Ventilation");}
 if(/heat stroke/.test(d)){add(beneficial,"Rapid Cooling","Warming / Cooling","Oxygen","IV / IO Access","IV Fluids","Rapid Transport");add(critical,"Rapid Cooling");}
 if(/hyperkal/.test(d)){add(beneficial,"Cardiac Monitor","12-Lead ECG","IV / IO Access","Oxygen","Rapid Transport");add(critical,"Cardiac Monitor","IV / IO Access","Rapid Transport");}
 if(/sepsis/.test(d)){add(beneficial,"Oxygen","IV / IO Access","IV Fluids","Rapid Transport");add(critical,"IV / IO Access","IV Fluids","Rapid Transport");}
 if(/transfusion reaction/.test(d)){add(beneficial,"Stop Transfusion","Oxygen","IV / IO Access","IV Fluids","Rapid Transport");add(critical,"Stop Transfusion");}
 if(/severe hypothermia/.test(d)){add(beneficial,"Gentle Handling / Prevent Heat Loss","Warming / Cooling","Oxygen","IV / IO Access","IV Fluids","Rapid Transport");add(critical,"Gentle Handling / Prevent Heat Loss","Warming / Cooling");}
 if(/disseminated intravascular coagulation|dic/.test(d)){add(beneficial,"Direct Pressure / Dressing","Blood Products / SWiFT","Warming / Cooling","Rapid Transport");add(critical,"Direct Pressure / Dressing","Rapid Transport");}
 if(/respiratory failure/.test(d)){add(beneficial,"Airway Positioning","Suction","Oxygen","BVM Ventilation","Advanced Airway / RSI","Ventilator Management","Rapid Transport");add(critical,"BVM Ventilation");}
 if(/closed long-bone fracture|fracture/.test(d)){add(beneficial,"Neurovascular Check","Splinting","Rapid Transport");add(critical,"Neurovascular Check","Splinting");}
 if(/major external bleeding/.test(d)){add(beneficial,"Direct Pressure / Dressing","Tourniquet","Warming / Cooling","Rapid Transport");add(critical,"Direct Pressure / Dressing","Tourniquet");add(harmful,"Nitroglycerin");}
 if(/drowning/.test(d)){add(beneficial,"Airway Positioning","Suction","Oxygen","BVM Ventilation","Warming / Cooling","Rapid Transport");add(critical,"Oxygen","BVM Ventilation");}
 if(/mild hypothermia|moderate hypothermia/.test(d)){add(beneficial,"Gentle Handling / Prevent Heat Loss","Warming / Cooling","IV / IO Access","IV Fluids","Rapid Transport");add(critical,"Warming / Cooling");}
 if(/ingested poison/.test(d)){add(beneficial,"Exposure Identification","Activated Charcoal","Rapid Transport");add(critical,"Exposure Identification");}
 if(/dehydration/.test(d)){add(beneficial,"IV / IO Access","IV Fluids","Rapid Transport");add(critical,"IV / IO Access","IV Fluids");}
 if(/catastrophic hemorrhage/.test(d)){add(beneficial,"Direct Pressure / Dressing","Tourniquet","IV / IO Access","IV Fluids","TXA","Warming / Cooling","Rapid Transport");add(critical,"Direct Pressure / Dressing","Tourniquet");add(harmful,"Nitroglycerin");}
 if(/ventricular fibrillation|cardiac arrest/.test(d)){add(beneficial,"CPR / AED","CPR / Defibrillation","BVM Ventilation","Cardiac Arrest Epinephrine","Epinephrine","IV / IO Access");add(critical,"CPR / AED","CPR / Defibrillation");}
 if(/symptomatic bradycardia|bradycardia/.test(d)){add(beneficial,"Cardiac Monitor","12-Lead ECG","IV / IO Access","Atropine","Oxygen");add(critical,"Cardiac Monitor","Atropine");}
 if(/svt/.test(d)){add(beneficial,"Cardiac Monitor","12-Lead ECG","IV / IO Access","Synchronized Cardioversion","Rapid Transport");add(critical,"Cardiac Monitor");}
 if(/atrial fibrillation/.test(d)){add(beneficial,"Cardiac Monitor","12-Lead ECG","IV / IO Access","Synchronized Cardioversion","Rapid Transport");add(critical,"Cardiac Monitor");}
 if(/ventricular tachycardia/.test(d)){add(beneficial,"Cardiac Monitor","12-Lead ECG","IV / IO Access","Oxygen","Synchronized Cardioversion");add(critical,"Synchronized Cardioversion");}
 if(/major burn|inhalation injury/.test(d)){add(beneficial,"Oxygen","IV / IO Access","IV Fluids","Advanced Airway / RSI","Rapid Transport");add(critical,"Oxygen","Advanced Airway / RSI");}
 if(/hemorrhagic shock requiring blood product|swift/.test(d)){add(beneficial,"Blood Products / SWiFT","Warming / Cooling","Rapid Transport");add(critical,"Blood Products / SWiFT");}

 // Fallback so every scenario always has a visible must-address item even if a new scenario is added later.
 if(!critical.length) add(critical,"Initial ABCDE / Vitals");
 return {beneficial,critical,harmful};
}
function timingRules(s,rules){
 const d=(s.diagnosis||s.condition).toLowerCase();
 // Deadlines are simulation pacing defaults for training, not clinical protocol time limits.
 if(/major external hemorrhage/.test(d)) return [{seconds:120,requires:["Direct Pressure / Dressing","Tourniquet"],label:"Control catastrophic extremity bleeding",stage:1},{seconds:240,requires:["Direct Pressure / Dressing","Tourniquet"],label:"Hemorrhage still uncontrolled",stage:2}];
 if(/anaphyl/.test(d)) return [{seconds:120,requires:["IM Epinephrine"],label:"Administer IM epinephrine",stage:1},{seconds:240,requires:["IM Epinephrine"],label:"Anaphylaxis remains untreated",stage:2}];
 if(/opioid/.test(d)) return [{seconds:90,requires:["BVM Ventilation"],label:"Support ventilation",stage:1},{seconds:180,requires:["BVM Ventilation"],label:"Ventilatory failure continues",stage:2}];
 if(/tension pneumothorax/.test(d)) return [{seconds:120,requires:["Needle Decompression","Open Thoracostomy / Surgical Airway"],label:"Relieve tension physiology",stage:1},{seconds:240,requires:["Needle Decompression","Open Thoracostomy / Surgical Airway"],label:"Obstructive shock continues",stage:2}];
 if(/hypogly/.test(d)) return [{seconds:180,requires:["Oral Glucose","IV Dextrose"],label:"Correct hypoglycemia",stage:1},{seconds:300,requires:["Oral Glucose","IV Dextrose"],label:"Glucose remains uncorrected",stage:2}];
 if(/asthma/.test(d)) return [{seconds:180,requires:["Albuterol / Ipratropium"],label:"Begin bronchodilator treatment",stage:1},{seconds:360,requires:["Albuterol / Ipratropium"],label:"Severe bronchospasm remains untreated",stage:2}];
 if(/ventricular fibrillation|cardiac arrest/.test(d)) return [{seconds:60,requires:["CPR / AED","CPR / Defibrillation"],label:"Begin CPR / defibrillation",stage:1},{seconds:180,requires:["CPR / AED","CPR / Defibrillation"],label:"Shockable arrest remains untreated",stage:2}];
 if(/ventricular tachycardia/.test(d)) return [{seconds:120,requires:["Synchronized Cardioversion"],label:"Treat unstable V-Tach",stage:1},{seconds:240,requires:["Synchronized Cardioversion"],label:"Unstable V-Tach persists",stage:2}];
 if(rules.critical.length && (s.stages||[]).length) return [{seconds:180,requires:rules.critical,label:"Complete critical intervention",stage:1},{seconds:360,requires:rules.critical,label:"Critical problem remains untreated",stage:2}];
 return [];
}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function renderTreatmentPanel(out,s,p,progression){
 const available=treatmentCatalog[s.difficulty]||treatmentCatalog.Basic;
 const rules=treatmentRules(s), deadlines=progression==="Dynamic"?timingRules(s,rules):[];
 const completed=new Map(); let elapsed=0,running=false,lastTick=null,timerId=null,currentStage=0,reassessCount=0;
 const id=`tx-${Date.now()}`;
 const expected=rules.beneficial.filter(t=>available.includes(t));
 const critical=rules.critical.filter(t=>available.includes(t));
 const deadlineFor=t=>{const x=deadlines.find(d=>d.requires.includes(t));return x?fmtTime(x.seconds):""};
 out.insertAdjacentHTML("beforeend",`
 <div class="card fto-actions"><div class="fto-private">FTO QUICK REFERENCE — DO NOT SHOW STUDENT</div><h3>Trainee Expected Actions</h3>
 <div class="action-groups"><div class="action-group action-critical"><h4>Critical / Must Address</h4>${critical.length?critical.map(t=>`<div class="action-item"><span>${t}</span>${deadlineFor(t)?`<span class="action-deadline">by ${deadlineFor(t)}</span>`:""}</div>`).join(""):`<div class="private-note">No single mandatory treatment is defined for this scenario. Grade recognition, supportive care, and appropriate escalation.</div>`}</div>
 <div class="action-group action-expected"><h4>Expected / Beneficial</h4>${expected.length?expected.map(t=>`<div class="action-item"><span>${t}</span></div>`).join(""):`<div class="private-note">Supportive assessment and transport are the primary expectations.</div>`}</div></div>
 ${deadlines.length?`<div class="timer-help">Dynamic deadlines are simulation pacing rules. Missing a critical action by the displayed time automatically advances the untreated patient.</div>`:""}</div>
 <div id="${id}" class="treatment-panel"><h3>FTO Dynamic Control</h3>
 <div class="sim-header"><div class="sim-clock"><div class="sim-clock-label">SCENARIO TIME</div><div class="sim-time">00:00</div><div class="sim-status">Paused</div><div class="sim-controls"><button type="button" class="timer-start primary">START</button><button type="button" class="timer-pause">PAUSE</button><button type="button" class="timer-add">+30 SEC</button><button type="button" class="timer-reset">RESET</button></div></div>
 <div class="patient-state"><span class="stage-indicator">STAGE 1</span><h4>Current Patient Presentation</h4><div class="state-text">${fill(s.initial,p)} ${fill(s.vitals,p)}</div><div class="deadline-area"></div></div></div>
 <p>Select an action <strong>when the trainee actually performs or verbalizes it</strong>. The exact scenario time is recorded immediately.</p>
 <div class="treatment-grid">${available.map(t=>`<button type="button" class="treatment-btn" data-tx="${t}">${t}</button>`).join("")}</div>
 <button type="button" class="reassess-btn secondary">REASSESS PATIENT NOW</button>
 <div class="current-response"></div><div class="timeline"><div class="timeline-title">Scenario Timeline / Debrief Log</div><div class="timeline-list"><div class="timeline-entry"><span class="timeline-time">00:00</span><span class="timeline-text">Scenario loaded — timer paused.</span></div></div></div></div>`);
 const panel=document.getElementById(id),timeEl=panel.querySelector('.sim-time'),statusEl=panel.querySelector('.sim-status'),stageBadge=panel.querySelector('.stage-indicator'),stateText=panel.querySelector('.state-text'),deadlineArea=panel.querySelector('.deadline-area'),timeline=panel.querySelector('.timeline-list'),resp=panel.querySelector('.current-response');
 const logEvent=(text,cls="")=>{timeline.insertAdjacentHTML('beforeend',`<div class="timeline-entry ${cls}"><span class="timeline-time">${fmtTime(elapsed)}</span><span class="timeline-text">${text}</span></div>`);timeline.parentElement.scrollTop=timeline.parentElement.scrollHeight;};
 const requirementMet=req=>req.some(t=>completed.has(t));
 const updateClock=()=>{timeEl.textContent=fmtTime(elapsed);statusEl.textContent=running?'Running':'Paused';};
 const applyStage=(n,reason)=>{if(n<=currentStage)return;currentStage=n;const st=(s.stages||[])[Math.min(n-1,(s.stages||[]).length-1)];stageBadge.textContent=`STAGE ${n+1}`;stageBadge.className=`stage-indicator ${n===1?'stage2':'stage3'}`;if(st){stateText.textContent=st.text;logEvent(`${st.title}: ${reason} ${st.text}`,'warn');}else{stateText.textContent='The patient continues to deteriorate because the underlying critical problem remains untreated.';logEvent(`Patient deteriorated: ${reason}`,'warn');}resp.innerHTML=`<div class="card response-card worse"><h3>AUTOMATIC PROGRESSION — STAGE ${n+1}</h3><p>${st?st.text:'The patient continues to deteriorate.'}</p></div>`;};
 const evaluateDeadlines=()=>{let next=null;deadlines.forEach(d=>{if(elapsed>=d.seconds&&!requirementMet(d.requires)){if(!next||d.stage>next.stage)next=d;}});if(next){deadlineArea.innerHTML=`<div class="deadline-banner">⚠ Missed timed action: <strong>${next.label}</strong> by ${fmtTime(next.seconds)}</div>`;applyStage(next.stage,`Timed critical action missed (${next.label}).`);}else{const future=deadlines.filter(d=>elapsed<d.seconds&&!requirementMet(d.requires)).sort((a,b)=>a.seconds-b.seconds)[0];deadlineArea.innerHTML=future?`<div class="private-note">Next timed checkpoint: <strong>${future.label}</strong> by ${fmtTime(future.seconds)}</div>`:'';}};
 const tick=()=>{if(!running)return;const now=Date.now();elapsed+=(now-lastTick)/1000;lastTick=now;updateClock();evaluateDeadlines();timerId=setTimeout(tick,250);};
 const start=()=>{if(running)return;running=true;lastTick=Date.now();updateClock();logEvent('Scenario timer started.');tick();};
 const pause=()=>{if(!running)return;running=false;if(timerId)clearTimeout(timerId);updateClock();logEvent('Scenario timer paused.');};
 panel.querySelector('.timer-start').addEventListener('click',start);
 panel.querySelector('.timer-pause').addEventListener('click',pause);
 panel.querySelector('.timer-add').addEventListener('click',()=>{elapsed+=30;updateClock();logEvent('FTO advanced simulation clock by 30 seconds.');evaluateDeadlines();});
 panel.querySelector('.timer-reset').addEventListener('click',()=>{pause();elapsed=0;currentStage=0;completed.clear();panel.querySelectorAll('.treatment-btn').forEach(b=>b.classList.remove('done','harmful-picked'));stageBadge.textContent='STAGE 1';stageBadge.className='stage-indicator';stateText.textContent=`${fill(s.initial,p)} ${fill(s.vitals,p)}`;deadlineArea.innerHTML='';resp.innerHTML='';timeline.innerHTML='<div class="timeline-entry"><span class="timeline-time">00:00</span><span class="timeline-text">Scenario reset.</span></div>';updateClock();evaluateDeadlines();});
 panel.querySelectorAll('.treatment-btn').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.tx;if(completed.has(t))return;completed.set(t,elapsed);b.classList.add('done');if(rules.harmful.includes(t)){b.classList.add('harmful-picked');logEvent(`${t} performed — potentially inappropriate/harmful for this scenario.`,'warn');resp.innerHTML=`<div class="card response-card worse"><h3>NEGATIVE RESPONSE</h3><p>The patient worsens or receives no benefit from an inappropriate intervention. Reassess ABCs and correct the treatment plan.</p></div>`;}else if(rules.beneficial.includes(t)){logEvent(`${t} performed.`,'good');}else{logEvent(`${t} performed.`);}evaluateDeadlines();}));
 panel.querySelector('.reassess-btn').addEventListener('click',()=>{reassessCount++;const criticalMet=rules.critical.length===0||rules.critical.some(t=>completed.has(t));const harmful=[...completed.keys()].filter(t=>rules.harmful.includes(t));const beneficial=[...completed.keys()].filter(t=>rules.beneficial.includes(t));let status='stable',title='UNCHANGED',text='The patient remains largely unchanged. Continue assessment and address the underlying problem.';if(harmful.length){status='worse';title='DETERIORATING';text='An inappropriate intervention has contributed to a worse clinical course.';}else if(criticalMet&&beneficial.length){status='improved';title='IMPROVING / STABILIZING';text=currentStage>0?'The critical problem is now being addressed. Further deterioration slows or stops, but prior physiologic losses do not instantly reverse. Continue resuscitation and reassessment.':'The patient shows an appropriate favorable response to treatment. Continue monitoring and reassessment.';}else if(!criticalMet){status='worse';title='DETERIORATING';text='A critical problem remains untreated.';}resp.innerHTML=`<div class="card response-card ${status}"><h3>Reassessment ${reassessCount}: ${title}</h3><p>${text}</p><div class="private-note"><strong>Critical action:</strong> ${criticalMet?'Completed / not required':'Still missing: '+critical.filter(t=>!completed.has(t)).join(' or ')}<br><strong>Completed actions:</strong> ${[...completed.entries()].map(([t,tm])=>`${t} (${fmtTime(tm)})`).join(', ')||'None'}</div></div>`;logEvent(`Patient reassessed — ${title}.`,status==='improved'?'good':status==='worse'?'warn':'');});
 updateClock();evaluateDeadlines();
}
function renderFTO(out,s,p,progression){
 out.insertAdjacentHTML("beforeend",`<div class="fto-title">INSTRUCTOR VIEW — ALL INFORMATION VISIBLE</div>${card("Intended Diagnosis",s.diagnosis,"diagnosis-card")}${card("Initial Assessment",fill(s.initial,p))}${card("History",fill(s.history,p))}${card("Physical Exam",fill(s.exam,p))}${card("Vital Signs",fill(s.vitals,p))}${s.ecg?card("ECG / Monitor",s.ecg):""}${s.additional?card("Additional Information",s.additional):""}`);
 if(progression==="Dynamic"&&s.stages.length){out.insertAdjacentHTML("beforeend",`<div class="subheading">Untreated Dynamic Progression — FTO Reference</div>${s.stages.map(st=>card(st.title,st.text,`stage-card ${st.critical?"critical":""}`)).join("")}`)}
 renderTreatmentPanel(out,s,p,progression);
 out.insertAdjacentHTML("beforeend",`<div class="card"><h3>Expected Management</h3>${list(s.management)}${s.criticalActions?`<div class="subheading">Critical Actions</div>${list(s.criticalActions)}`:""}${s.scopeNotes?`<div class="subheading">Server Scope / Training Notes</div>${list(s.scopeNotes)}`:""}${s.harmfulActions?`<div class="subheading">Potentially Harmful / Incorrect Actions</div>${list(s.harmfulActions)}`:""}<div class="subheading">Teaching Points</div>${list(s.teaching)}</div>`);
}

$("generate").addEventListener("click",generate);
$("mode").addEventListener("change",updateSpecificOptions);
$("type").addEventListener("change",updateSpecificOptions);
$("difficulty").addEventListener("change",updateSpecificOptions);
updateSpecificOptions();
