*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#101820;color:#fff}header{background:#18242f;padding:20px;text-align:center;border-bottom:3px solid #e63946}header h1{margin:0}header p{margin:6px 0 0;color:#b8c1c8}.top-nav{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}.top-nav a{color:#fff;text-decoration:none;background:#253542;border:1px solid #4d5c68;padding:8px 14px;border-radius:999px;font-size:14px}.top-nav a:hover,.top-nav a.active{background:#e63946;border-color:#e63946}.container{max-width:1000px;margin:auto;padding:20px}.section{background:#18242f;padding:20px;margin-bottom:20px;border-radius:10px}.section h2{margin-top:0;border-bottom:1px solid #344451;padding-bottom:10px}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}label{display:block;margin-bottom:6px;color:#d5dce1}select{width:100%;min-height:44px;padding:10px 12px;background:#101820;color:#fff;border:1px solid #4d5c68;border-radius:6px;font-size:15px}.generate{width:100%;min-height:54px;border:none;border-radius:8px;background:#e63946;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}.generate:hover{background:#c92f3b}.scenario{display:none}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.badge{background:#253542;border:1px solid #4d5c68;border-radius:999px;padding:6px 10px;font-size:13px}.card{background:#101820;border-radius:8px;padding:17px;margin-bottom:14px;border-left:4px solid #4d5c68}.card h3{margin:0 0 9px;font-size:18px}.card p{margin:0;line-height:1.6;color:#d9e0e5}.dispatch{border-left-color:#e63946}.scene{border-left-color:#7d98a1}.reveal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.reveal-btn,.stage-btn,.diagnosis-btn{min-height:46px;border:1px solid #4d5c68;border-radius:7px;background:#253542;color:#fff;font-weight:bold;cursor:pointer;padding:10px}.reveal-btn:hover,.stage-btn:hover{background:#344957}.reveal-btn.revealed{background:#344451;color:#aebac3;cursor:default}.hidden-info{display:none}.stage-card{border-left-color:#f0a202}.stage-card.critical{border-left-color:#e63946}.diagnosis-btn{width:100%;background:#e63946;border-color:#e63946;font-size:16px;margin-top:8px}.diagnosis-btn:hover{background:#c92f3b}.diagnosis-card{display:none;border:2px solid #e63946;background:#25171a}.diagnosis-title{font-size:24px;font-weight:bold;margin-bottom:10px}.subheading{font-weight:bold;margin:13px 0 5px}.detail-list{margin:0;padding-left:21px;line-height:1.6;color:#d9e0e5}.fto-title{font-size:12px;font-weight:bold;letter-spacing:.7px;color:#ffbbc1;margin-bottom:6px}.notice{font-size:13px;color:#9caab5;text-align:center;line-height:1.5;margin-top:20px}.empty{background:#101820;padding:18px;border-radius:8px;color:#d9e0e5}.stage-controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.stage-btn{flex:1;min-width:180px}.scenario-counter{color:#9caab5;font-size:13px;margin-top:8px;text-align:center}@media(max-width:850px){.controls{grid-template-columns:repeat(2,1fr)}.controls>div:last-child{grid-column:span 2}.reveal-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.container{padding:12px}.section{padding:15px}.controls{grid-template-columns:1fr}.controls>div:last-child{grid-column:auto}.reveal-grid{grid-template-columns:1fr}}

<header><h1>EMS Scenario Generator</h1><p>Practice medical decision-making without seeing the answer first</p><nav class="top-nav"><a href="index.html">Clinical Assistant</a><a href="scenario-generator.html" class="active">Scenario Generator</a></nav></header>
<div class="container">
<div class="section">
<h2>Scenario Setup</h2>
<div class="controls">
<div><label for="type">Scenario Type</label><select id="type"><option value="Random">Random</option><option value="Medical">Medical</option><option value="Trauma">Trauma</option><option value="Environmental">Environmental</option><option value="Toxicology">Toxicology</option></select></div>
<div><label for="difficulty">Difficulty</label><select id="difficulty"><option value="Basic">Basic</option><option value="Advanced EMT">Advanced EMT</option><option value="Paramedic">Paramedic</option><option value="Critical Care Paramedic">Critical Care Paramedic</option></select></div>
<div><label for="patient">Patient</label><select id="patient"><option value="Adult">Adult</option><option value="Geriatric">Geriatric</option></select></div>
<div><label for="progression">Progression</label><select id="progression"><option value="Static">Static</option><option value="Dynamic">Dynamic</option></select></div>

</div>

<script>
const scenarios=[
{condition:"Hypoglycemia",type:"Medical",difficulty:"Basic",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} reported to be confused and acting strangely.",scene:"You find the patient seated at the kitchen table. Family states the patient was normal earlier today but became sweaty, irritable, and confused over the last 20 minutes.",initial:"Airway is patent. Breathing is regular and adequate. Radial pulse is fast and strong. Patient is confused but follows simple commands.",history:"History of diabetes. Family reports the patient took insulin this morning and ate very little afterward.",exam:"Skin is pale, cool, and sweaty. No facial droop or one-sided weakness is noted. No evidence of trauma.",vitals:"HR 112, BP 138/82, RR 18, SpO₂ 97%, Temp 98.1°F, BGL 42 mg/dL.",additional:"No seizure activity has been witnessed. Patient can currently follow commands but is becoming less cooperative.",diagnosis:"Hypoglycemia",management:["Confirm low blood glucose.","Treat glucose according to mental status and ability to swallow.","Reassess mental status and BGL after treatment.","Evaluate why the episode occurred and consider transport."],teaching:["AMS can mimic stroke or intoxication.","BGL should be checked early in unexplained altered mental status."],stages:[{title:"Stage 2",text:"Without treatment, the patient becomes increasingly lethargic and is no longer safe to give anything by mouth. Repeat BGL is 34 mg/dL."},{title:"Stage 3",text:"The patient becomes unresponsive and has a brief generalized seizure. Airway and glucose correction are now immediate priorities.",critical:true}]},
{condition:"Asthma Exacerbation",type:"Medical",difficulty:"Basic",dispatch:"Medic 1, respond to an apartment for a {age}-year-old {sex} with difficulty breathing.",scene:"The patient is sitting upright near an open window and speaking in short sentences. An inhaler is on the table nearby.",initial:"Airway is patent. Respirations are fast and labored with accessory muscle use. Radial pulse is fast and strong.",history:"History of asthma. Symptoms worsened after cleaning a dusty room. The rescue inhaler has provided little relief today.",exam:"Diffuse expiratory wheezing bilaterally. No hives or facial swelling. Skin is warm and slightly sweaty.",vitals:"HR 118, BP 146/84, RR 28, SpO₂ 91%, Temp 98.6°F.",additional:"The patient denies chest trauma or fever.",diagnosis:"Asthma Exacerbation",management:["Support oxygenation and ventilation.","Administer bronchodilator therapy per protocol.","Reassess lung sounds, work of breathing, and mental status.","Escalate ventilatory support if the patient begins to fail."],teaching:["Worsening asthma may become quieter as air movement decreases.","Mental-status change is a late and concerning finding."],stages:[{title:"Stage 2",text:"The patient becomes more fatigued. RR 34, SpO₂ 86%. Wheezing is now quieter and breath sounds are diminished."},{title:"Stage 3",text:"The patient is minimally responsive with shallow respirations at 10/min and nearly absent breath sounds. Respiratory failure is developing.",critical:true}]},
{condition:"Syncope / Near Syncope",type:"Medical",difficulty:"Basic",dispatch:"Medic 1, respond to a public location for a {age}-year-old {sex} who fainted.",scene:"The patient is now awake and seated on the floor. Bystanders report a brief loss of consciousness lasting less than a minute.",initial:"Airway is patent, respirations are normal, and radial pulse is regular. Patient is alert and oriented now.",history:"Patient reports standing for a long period and feeling lightheaded just before fainting. No known seizure history.",exam:"No obvious trauma. Neuro exam is grossly normal. Skin is slightly pale.",vitals:"HR 88, BP 108/68, RR 16, SpO₂ 98%, BGL 102 mg/dL.",additional:"Patient denies chest pain and shortness of breath.",diagnosis:"Syncope / Near Syncope",management:["Assess for dangerous causes including cardiac, neurologic, bleeding, and metabolic problems.","Obtain ECG and BGL when appropriate.","Treat injuries from the fall if present.","Transport based on risk factors and clinical findings."],teaching:["Syncope is a symptom, not a final diagnosis.","A normal exam after the event does not rule out a serious cause."],stages:[]},
{condition:"Pneumonia",type:"Medical",difficulty:"Basic",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} with weakness and difficulty breathing.",scene:"The patient is in bed and looks ill. A family member reports several days of cough and fever.",initial:"Airway is patent. Respirations are fast but adequate. Radial pulse is fast.",history:"Three days of productive cough, fever, chills, and worsening fatigue.",exam:"Crackles are heard at the right lung base. Skin is warm. Patient has a frequent productive cough with yellow sputum.",vitals:"HR 108, BP 124/74, RR 24, SpO₂ 92%, Temp 101.8°F.",additional:"Patient reports pleuritic discomfort when coughing.",diagnosis:"Pneumonia",management:["Support oxygenation as needed.","Assess for sepsis and respiratory failure.","Provide supportive care and transport."],teaching:["Pneumonia may progress to sepsis or respiratory failure, especially in older adults."],stages:[{title:"Stage 2",text:"The patient becomes more fatigued. HR 118, RR 30, SpO₂ 88%, and BP falls to 104/64."},{title:"Stage 3",text:"The patient becomes confused and hypotensive at 86/52 with persistent hypoxia, suggesting progression to severe infection/sepsis.",critical:true}]},
{condition:"Alcohol Intoxication",type:"Toxicology",difficulty:"Basic",dispatch:"Medic 1, respond to a parking lot for a {age}-year-old {sex} who is unable to walk steadily.",scene:"The patient is seated against a wall with friends nearby. An odor of alcohol is present.",initial:"Airway is patent. Breathing is adequate. Radial pulse is strong. Patient responds appropriately but is slow and slurs words.",history:"Friends report heavy alcohol intake over several hours. They deny known drug use.",exam:"Unsteady gait, slurred speech, and mild nausea. No obvious trauma is found on initial exam.",vitals:"HR 96, BP 118/72, RR 16, SpO₂ 97%, Temp 97.4°F, BGL 91 mg/dL.",additional:"Patient vomited once before EMS arrival.",diagnosis:"Alcohol Intoxication",management:["Protect the airway and monitor breathing.","Check BGL and assess for trauma or other causes of AMS.","Provide supportive care and transport as appropriate."],teaching:["Do not assume alcohol explains every altered patient.","Occult trauma and hypoglycemia are important mimics."],stages:[]},
{condition:"Heat Exhaustion",type:"Environmental",difficulty:"Basic",dispatch:"Medic 1, respond to an outdoor work site for a {age}-year-old {sex} with weakness and dizziness.",scene:"The patient is sitting in the shade and is soaked with sweat after working outside for several hours.",initial:"Airway is patent. Breathing is rapid but adequate. Pulse is fast and slightly weak. Patient is alert.",history:"Several hours of heavy work in hot weather with limited fluid intake.",exam:"Skin is cool and clammy despite the hot environment. Patient reports weakness, nausea, dizziness, and muscle cramps.",vitals:"HR 114, BP 102/64, RR 24, SpO₂ 98%, Temp 100.4°F.",additional:"No confusion or seizure activity is present.",diagnosis:"Heat Exhaustion",management:["Remove from heat and begin cooling.","Place supine as tolerated and remove excess clothing.","Replace fluids as appropriate.","Watch closely for progression to heat stroke."],teaching:["Normal mental status helps distinguish heat exhaustion from heat stroke."],stages:[{title:"Stage 2",text:"If the patient remains in the heat, weakness worsens and BP falls to 92/56. The patient is still oriented but increasingly exhausted."},{title:"Stage 3",text:"The patient develops confusion and a core temperature above 104°F. The scenario has progressed to heat stroke.",critical:true}]},
{condition:"Simple Pneumothorax",type:"Trauma",difficulty:"Basic",dispatch:"Medic 1, respond to a sports facility for a {age}-year-old {sex} with chest pain after blunt chest trauma.",scene:"The patient is sitting upright after being struck hard in the side of the chest. They are anxious and mildly short of breath.",initial:"Airway is patent. Respirations are fast but adequate. Radial pulse is strong.",history:"No major medical history. Symptoms began immediately after the impact.",exam:"Tenderness over the affected lateral chest. Breath sounds are diminished on that side. No open wound or JVD.",vitals:"HR 104, BP 132/78, RR 24, SpO₂ 93%.",additional:"The patient reports sharp pain worse with inspiration.",diagnosis:"Simple Pneumothorax",management:["Support oxygenation and ventilation as needed.","Monitor closely for progression to tension physiology.","Transport for definitive evaluation."],teaching:["A simple pneumothorax can become a tension pneumothorax, especially with positive-pressure ventilation."],stages:[{title:"Stage 2",text:"Breathing becomes more difficult. SpO₂ drops to 88%, RR 30, and breath sounds on the affected side become nearly absent."},{title:"Stage 3",text:"BP falls to 82/48, the patient becomes confused, and neck veins become distended. Tension physiology is now present.",critical:true}]},

{condition:"Anaphylaxis",type:"Medical",difficulty:"Advanced EMT",dispatch:"Medic 1, respond to a restaurant for a {age}-year-old {sex} with an allergic reaction.",scene:"The patient is seated on the floor and appears frightened. Staff report symptoms started shortly after eating.",initial:"Airway is currently patent but voice is becoming hoarse. Breathing is labored with wheezing. Pulse is rapid.",history:"Known severe food allergy. Patient believes the meal may have contained the allergen.",exam:"Hives across the chest and arms with swelling of the lips. Wheezing is present bilaterally.",vitals:"HR 126, BP 88/54, RR 28, SpO₂ 90%.",additional:"Patient reports nausea and throat tightness.",diagnosis:"Anaphylaxis",management:["Administer IM epinephrine when indicated by protocol.","Support airway, oxygenation, and ventilation.","Establish vascular access and treat hypotension with fluids as appropriate.","Reassess frequently for worsening airway swelling."],teaching:["Epinephrine is the key treatment for anaphylaxis.","Skin findings may be absent in some severe reactions."],stages:[{title:"Stage 2",text:"Stridor develops and the patient can only speak one or two words at a time. BP is 76/42 and SpO₂ is 84%."},{title:"Stage 3",text:"The patient becomes minimally responsive with severe airway swelling and inadequate respirations.",critical:true}]},
{condition:"COPD Exacerbation",type:"Medical",difficulty:"Advanced EMT",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} with worsening shortness of breath.",scene:"The patient is seated in a tripod position with home oxygen tubing in place.",initial:"Airway is patent. Respirations are labored and prolonged. Pulse is fast.",history:"History of COPD with several days of increased cough and sputum production.",exam:"Diffuse wheezing and diminished breath sounds. Accessory muscle use is present.",vitals:"HR 110, BP 148/86, RR 28, SpO₂ 86% on home oxygen.",additional:"Patient denies sudden chest pain and has no unilateral leg swelling.",diagnosis:"COPD Exacerbation",management:["Support oxygenation and ventilation.","Administer bronchodilators per protocol.","Consider CPAP/NIV when indicated.","Watch for fatigue and respiratory failure."],teaching:["Treat the patient, not a feared oxygen number alone.","Declining mental status or respiratory rate may signal failure rather than improvement."],stages:[{title:"Stage 2",text:"After continued work of breathing the patient becomes tired. RR falls from 30 to 20, but tidal volume is poor and mental status is slowing."},{title:"Stage 3",text:"The patient is difficult to arouse with shallow respirations and worsening hypoxia, indicating respiratory failure.",critical:true}]},
{condition:"Upper GI Bleed",type:"Medical",difficulty:"Advanced EMT",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} vomiting blood.",scene:"The patient is seated beside a trash can containing dark red and coffee-ground appearing emesis.",initial:"Airway is patent. Breathing is mildly rapid. Radial pulse is fast and weak. Patient appears pale.",history:"Several days of upper abdominal discomfort and dark stools. Patient takes frequent NSAIDs.",exam:"Pale, cool, clammy skin. Mild epigastric tenderness without rigidity.",vitals:"HR 118, BP 96/58, RR 22, SpO₂ 97%.",additional:"Patient reports dizziness when standing and black tarry stools since yesterday.",diagnosis:"Upper GI Bleed",management:["Protect the airway and have suction ready.","Establish vascular access and treat shock according to protocol.","Keep the patient warm and transport promptly."],teaching:["Coffee-ground emesis and melena suggest upper GI bleeding.","Normal SpO₂ does not indicate adequate circulating volume."],stages:[{title:"Stage 2",text:"The patient has another large episode of hematemesis. HR rises to 132 and BP falls to 82/46."},{title:"Stage 3",text:"The patient becomes confused, cool, and profoundly weak with a barely palpable radial pulse.",critical:true}]},
{condition:"Hemothorax",type:"Trauma",difficulty:"Advanced EMT",dispatch:"Medic 1, respond to a motor vehicle collision for a {age}-year-old {sex} with chest trauma.",scene:"The patient is restrained in the vehicle and complains of severe chest pain and shortness of breath after a significant side impact.",initial:"Airway is patent. Breathing is rapid and labored. Radial pulse is fast and weak.",history:"No relevant medical history is immediately available.",exam:"Bruising over one side of the chest with markedly decreased breath sounds on that side. Neck veins are flat. Skin is pale and clammy.",vitals:"HR 126, BP 92/58, RR 30, SpO₂ 89%.",additional:"No open chest wound is seen.",diagnosis:"Hemothorax",management:["Support oxygenation and ventilation.","Treat for hemorrhagic shock and maintain warmth.","Rapid trauma-center transport is important."],teaching:["Hemothorax can cause both respiratory compromise and significant blood loss.","Flat neck veins support volume loss rather than obstructive shock."],stages:[{title:"Stage 2",text:"Breath sounds become nearly absent on the affected side. BP falls to 80/44 and mental status begins to decline."},{title:"Stage 3",text:"The patient becomes unresponsive with severe shock and worsening respiratory compromise.",critical:true}]},
{condition:"Carbon Monoxide Poisoning",type:"Toxicology",difficulty:"Advanced EMT",dispatch:"Medic 1, respond to a residence for multiple people with headache and nausea.",scene:"A family has exited the home after a carbon monoxide alarm activated. Your patient is a {age}-year-old {sex} complaining of headache and dizziness.",initial:"Airway and breathing appear normal. Pulse is mildly elevated. Patient is alert but slow to answer.",history:"The furnace has been running all morning. Several people in the home developed similar symptoms.",exam:"No focal neurologic deficits. Skin appearance is nonspecific. Pulse oximetry appears normal.",vitals:"HR 104, BP 136/80, RR 20, SpO₂ 99% on room air.",additional:"Patient reports nausea and a pounding headache. A second family member briefly fainted.",diagnosis:"Carbon Monoxide Poisoning",management:["Remove from the source and provide high-concentration oxygen.","Cardiac monitoring and transport are appropriate.","Consider hyperbaric consultation based on severity and local guidance."],teaching:["Standard pulse oximetry may appear normal in carbon monoxide poisoning.","Multiple patients with similar symptoms in the same environment is an important clue."],stages:[{title:"Stage 2",text:"The patient becomes increasingly confused and develops chest discomfort."},{title:"Stage 3",text:"The patient has a generalized seizure and becomes unresponsive, indicating severe toxicity.",critical:true}]},
{condition:"Opioid Overdose",type:"Toxicology",difficulty:"Advanced EMT",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} who is difficult to wake.",scene:"The patient is lying on a couch. Drug paraphernalia is present nearby.",initial:"Patient responds only to painful stimulus. Respirations are slow and shallow. Radial pulse is slow but present.",history:"A bystander reports possible fentanyl use shortly before the patient became unresponsive.",exam:"Pinpoint pupils, cool skin, and very poor respiratory effort. No major trauma is seen.",vitals:"HR 58, BP 98/60, RR 6, SpO₂ 79%.",additional:"The patient has a pulse but is not protecting the airway well.",diagnosis:"Opioid Overdose",management:["Ventilation and airway support are the immediate priorities.","Administer naloxone per protocol while continuing ventilation.","Titrate treatment toward adequate breathing and reassess frequently."],teaching:["Do not delay ventilation while waiting for naloxone.","The goal is adequate ventilation, not necessarily complete awakening."],stages:[{title:"Stage 2",text:"Without ventilation, SpO₂ falls further and the heart rate drops into the 40s."},{title:"Stage 3",text:"The patient becomes apneic. A pulse is still present initially, making this a respiratory arrest.",critical:true}]},

{condition:"ACS / Heart Attack",type:"Medical",difficulty:"Paramedic",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} with chest pressure and sweating.",scene:"The patient is seated on the couch, pale and visibly uncomfortable, clutching the center of the chest.",initial:"Airway is patent. Breathing is mildly rapid. Radial pulse is regular but fast.",history:"Crushing central chest pressure began 30 minutes ago and radiates to the left arm. History of hypertension and high cholesterol.",exam:"Pale, cool, diaphoretic skin. Lung sounds are clear. No chest-wall tenderness reproduces the pain.",vitals:"HR 104, BP 154/92, RR 22, SpO₂ 96%.",additional:"12-lead ECG shows ST elevation in II, III, and aVF with reciprocal changes in aVL.",ecg:"Inferior STEMI pattern: ST elevation in II, III, aVF with reciprocal depression in aVL.",diagnosis:"ACS / Inferior STEMI",management:["Obtain and interpret a 12-lead ECG.","Give aspirin when indicated and without contraindication.","Use oxygen only when clinically indicated.","Evaluate blood pressure and contraindications before nitroglycerin.","Activate STEMI transport/notification procedures."],teaching:["Inferior STEMI can involve the right ventricle.","Hypotension should change how preload-reducing medications are approached."],stages:[{title:"Stage 2",text:"The patient becomes nauseated and BP falls to 94/60. HR is now 58. A right-sided ECG shows ST elevation in V4R."},{title:"Stage 3",text:"The patient suddenly becomes unresponsive and pulseless with ventricular fibrillation on the monitor.",critical:true}]},
{condition:"Stroke",type:"Medical",difficulty:"Paramedic",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} with sudden weakness and speech difficulty.",scene:"The patient is seated at a table with family present. One side of the face is visibly drooping.",initial:"Airway is patent and respirations are adequate. Pulse is regular. Patient is alert but has difficulty speaking.",history:"Family states symptoms began suddenly 25 minutes ago. Last known well was immediately before onset.",exam:"Facial droop, slurred speech, and marked weakness of the right arm and leg. No seizure witnessed.",vitals:"HR 86, BP 188/104, RR 18, SpO₂ 97%, BGL 118 mg/dL.",additional:"Patient takes an anticoagulant for atrial fibrillation.",diagnosis:"Acute Stroke",management:["Determine last known well time.","Perform a stroke assessment and check BGL.","Protect airway as needed and avoid unnecessary delays.","Rapidly transport to an appropriate stroke-capable facility with prenotification."],teaching:["Do not treat hypertension casually in suspected stroke without protocol/medical direction.","Anticoagulant use is important information for the receiving stroke team."],stages:[{title:"Stage 2",text:"Speech becomes more difficult and the patient develops increasing drowsiness while still maintaining the airway."},{title:"Stage 3",text:"The patient vomits and becomes unable to protect the airway, requiring aggressive airway management.",critical:true}]},
{condition:"Tension Pneumothorax",type:"Trauma",difficulty:"Paramedic",dispatch:"Medic 1, respond to a construction site for a {age}-year-old {sex} struck in the chest by heavy equipment.",scene:"The patient is supine and in severe respiratory distress after blunt chest trauma.",initial:"Airway is patent. Respirations are rapid and shallow. Radial pulse is fast and weak.",history:"Symptoms worsened quickly over several minutes after the impact.",exam:"Breath sounds are absent on the left. Neck veins are distended. The left chest appears hyperexpanded. Skin is cool and sweaty.",vitals:"HR 138, BP 78/44, RR 34, SpO₂ 81%.",additional:"Mental status is deteriorating rapidly.",diagnosis:"Tension Pneumothorax",management:["Support airway and oxygenation.","Perform immediate chest decompression when clinically indicated and authorized by protocol.","Reassess after decompression and transport rapidly."],teaching:["The key distinction from a simple pneumothorax is hemodynamic compromise.","Do not wait for every classic sign if the overall presentation strongly supports tension physiology."],stages:[{title:"Stage 2",text:"Without decompression the patient becomes minimally responsive, BP is unobtainable, and the radial pulse disappears."},{title:"Stage 3",text:"The patient becomes pulseless. Traumatic cardiac arrest is now present unless the obstructive cause is rapidly corrected.",critical:true}]},
{condition:"Cardiac Tamponade",type:"Trauma",difficulty:"Paramedic",dispatch:"Medic 1, respond to an assault for a {age}-year-old {sex} with a penetrating chest injury.",scene:"The patient is sitting against a wall with a small penetrating wound near the left chest. External bleeding is limited.",initial:"Airway is patent. Breathing is rapid. Radial pulse is very weak and fast.",history:"Injury occurred about 10 minutes ago.",exam:"Neck veins are distended. Heart sounds are distant. Lung sounds are present bilaterally. Skin is pale and clammy.",vitals:"HR 132, BP 82/58, RR 28, SpO₂ 93%.",additional:"Pulse pressure is narrowing and mental status is beginning to decline.",diagnosis:"Cardiac Tamponade",management:["Support ABCs and treat shock.","Rapid transport to definitive surgical care is essential.","Perform pericardial decompression only when within scope/protocol and clinically indicated."],teaching:["Beck's triad is JVD, hypotension, and muffled heart sounds.","Bilateral breath sounds with obstructive shock can help distinguish tamponade from tension pneumothorax."],stages:[{title:"Stage 2",text:"BP falls to 68/48 and the patient becomes increasingly confused. Peripheral pulses are barely palpable."},{title:"Stage 3",text:"The patient becomes pulseless with organized electrical activity on the monitor, consistent with PEA arrest from obstructive shock.",critical:true}]},
{condition:"DKA",type:"Medical",difficulty:"Paramedic",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} with vomiting, weakness, and abnormal breathing.",scene:"The patient is lying on a couch, appears dehydrated, and is breathing very deeply and rapidly.",initial:"Airway is patent. Respirations are deep and rapid. Radial pulse is fast and weak. Patient is awake but sluggish.",history:"Type 1 diabetes. Patient has been ill for two days and missed insulin doses because of vomiting.",exam:"Warm, dry skin, dry mucous membranes, and fruity odor on the breath. Generalized abdominal discomfort without guarding.",vitals:"HR 124, BP 96/60, RR 30 deep, SpO₂ 98%, BGL reads HIGH (>600 mg/dL).",additional:"Patient reports intense thirst and frequent urination before becoming too weak to get up.",diagnosis:"Diabetic Ketoacidosis",management:["Support ABCs and monitor ECG.","Establish IV access and begin protocol-directed fluid resuscitation.","Monitor for shock and transport for definitive metabolic management."],teaching:["Kussmaul respirations are compensatory and should not be mistaken for primary anxiety hyperventilation.","DKA commonly produces significant dehydration."],stages:[{title:"Stage 2",text:"The patient becomes more confused. HR 136, BP 84/50, with persistent deep respirations."},{title:"Stage 3",text:"The patient becomes obtunded with worsening shock and poor peripheral perfusion.",critical:true}]},
{condition:"Status Epilepticus",type:"Medical",difficulty:"Paramedic",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} actively seizing.",scene:"You arrive to find generalized tonic-clonic activity ongoing. Family states this is the second seizure without the patient waking up.",initial:"Airway is partially obstructed by secretions during convulsions. Breathing is irregular. Pulse is rapid.",history:"Known seizure disorder. Family is unsure whether medications were taken today.",exam:"Generalized seizure activity continues. No major trauma is seen.",vitals:"HR 142, BP 168/94, RR difficult to assess during seizure, SpO₂ 86%, BGL 104 mg/dL.",additional:"Total continuous/recurrent seizure time is now approximately 7 minutes.",diagnosis:"Status Epilepticus",management:["Protect the airway and oxygenate/ventilate as needed.","Check BGL and establish IV/IO access.","Administer benzodiazepine therapy per protocol.","Reassess for recurrent seizure and respiratory depression after treatment."],teaching:["Status epilepticus is seizure >5 minutes or recurrent seizures without regaining consciousness.","Post-treatment airway and ventilation monitoring is critical."],stages:[{title:"Stage 2",text:"Convulsions continue and SpO₂ falls despite basic airway positioning. The patient remains unresponsive between movements."},{title:"Stage 3",text:"After seizure activity stops, respirations are slow and inadequate and the patient remains deeply unresponsive.",critical:true}]},
{condition:"Pesticide / Nerve Agent Overdose",type:"Toxicology",difficulty:"Paramedic",dispatch:"Medic 1, respond to an agricultural property for a {age}-year-old {sex} with vomiting and difficulty breathing after pesticide exposure.",scene:"The patient is outside near spraying equipment. There is a strong chemical odor and visible liquid contamination on clothing.",initial:"Airway contains copious secretions. Respirations are labored with wet lung sounds. Pulse is slow.",history:"Coworkers report an accidental concentrated pesticide exposure shortly before symptoms began.",exam:"Pinpoint pupils, heavy sweating, salivation, tearing, vomiting, diarrhea, and diffuse bronchial secretions.",vitals:"HR 48, BP 90/54, RR 26 with poor air movement, SpO₂ 84%.",additional:"Scene safety and decontamination are required before routine patient care.",diagnosis:"Pesticide / Nerve Agent Overdose",management:["Prioritize scene safety, PPE, and decontamination.","Aggressively manage airway secretions and ventilation.","Administer atropine and other antidotal therapy according to protocol."],teaching:["Think wet: salivation, lacrimation, urination, GI symptoms, emesis, and bronchorrhea.","Responder contamination is a major hazard."],stages:[{title:"Stage 2",text:"Secretions worsen and the patient becomes increasingly hypoxic and confused."},{title:"Stage 3",text:"The patient becomes apneic with severe bradycardia and impending cardiac arrest.",critical:true}]},
{condition:"Heat Stroke",type:"Environmental",difficulty:"Paramedic",dispatch:"Medic 1, respond to a road race for a {age}-year-old {sex} who collapsed in the heat.",scene:"The patient is on the ground near the finish area. Bystanders say the patient became confused before collapsing.",initial:"Airway is patent. Respirations are fast. Pulse is very rapid. Patient is confused and combative.",history:"Prolonged exertion in hot, humid weather.",exam:"Skin is very hot. Patient has severe CNS dysfunction and cannot answer questions appropriately.",vitals:"HR 148, BP 92/50, RR 32, SpO₂ 95%, core Temp 105.6°F.",additional:"A brief generalized seizure occurs during assessment.",diagnosis:"Heat Stroke",management:["Begin immediate rapid active cooling.","Support oxygenation and ventilation as needed.","Establish IV access and treat circulatory compromise per protocol.","Monitor ECG and transport while cooling continues when feasible."],teaching:["Heat stroke is defined by severe hyperthermia plus CNS dysfunction.","Cooling should not be delayed for transport preparations."],stages:[{title:"Stage 2",text:"The patient becomes less responsive and BP falls to 78/42 despite ongoing tachycardia."},{title:"Stage 3",text:"The patient becomes comatose with abnormal respirations and severe shock.",critical:true}]},

{condition:"Dangerously High Potassium",type:"Medical",difficulty:"Critical Care Paramedic",dispatch:"Medic 1, respond to a dialysis center for a {age}-year-old {sex} with weakness and a slow heart rate.",scene:"The patient is pale and weak after missing a scheduled dialysis session.",initial:"Airway is patent. Breathing is adequate. Radial pulse is slow and irregular.",history:"End-stage renal disease on hemodialysis. Patient missed the last treatment because of transportation problems.",exam:"Generalized weakness and mild peripheral edema. No focal neurologic deficits.",vitals:"HR 38, BP 88/54, RR 20, SpO₂ 96%.",additional:"ECG shows tall peaked T waves progressing to QRS widening.",ecg:"Marked peaked T waves with widening QRS and bradycardia, concerning for severe hyperkalemia.",diagnosis:"Severe Hyperkalemia",management:["Continuous cardiac monitoring and rapid recognition are critical.","Provide protocol-directed membrane stabilization and potassium-shifting therapy.","Treat unstable bradycardia/dysrhythmias and arrange definitive dialysis."],teaching:["Severe hyperkalemia can rapidly progress from peaked T waves to wide-complex rhythms and arrest.","Pacing alone may be ineffective until the metabolic problem is treated."],stages:[{title:"Stage 2",text:"QRS widens further and HR falls to 28. BP is 70/40 and the patient becomes drowsy."},{title:"Stage 3",text:"The rhythm degenerates into a near sine-wave pattern followed by pulseless electrical activity.",critical:true}]},
{condition:"Sepsis",type:"Medical",difficulty:"Critical Care Paramedic",dispatch:"Medic 1, respond to a residence for a {age}-year-old {sex} with fever, weakness, and confusion.",scene:"The patient is in bed, lethargic and ill appearing. Family reports worsening symptoms over two days.",initial:"Airway is patent. Respirations are rapid. Pulse is very fast and weak. Patient is confused.",history:"Recent urinary infection treated incompletely. Oral intake has been poor.",exam:"Hot skin, dry mucous membranes, and suprapubic discomfort. Peripheral perfusion is delayed.",vitals:"HR 132, BP 78/44, RR 30, SpO₂ 93%, Temp 103.1°F.",additional:"Lactate, if available in your system, is markedly elevated. Patient has produced very little urine today.",diagnosis:"Septic Shock",management:["Support oxygenation and ventilation.","Establish vascular access and begin protocol-directed fluid resuscitation.","Consider vasopressor support when shock persists after appropriate volume resuscitation and according to critical-care protocol.","Rapid transport and sepsis notification are appropriate."],teaching:["Shock can persist even when the skin initially feels warm.","Reassess perfusion response rather than relying on a single blood-pressure value."],stages:[{title:"Stage 2",text:"After initial fluid resuscitation BP remains 76/42 with worsening confusion and mottled extremities."},{title:"Stage 3",text:"The patient becomes minimally responsive with profound vasodilatory shock and impending cardiovascular collapse.",critical:true}]},
{condition:"Blood Transfusion Reaction",type:"Medical",difficulty:"Critical Care Paramedic",dispatch:"Medic 1, respond to an infusion center for a {age}-year-old {sex} who became acutely ill during a blood transfusion.",scene:"The patient is reclined in an infusion chair with blood still running through an IV line. Staff report symptoms began minutes after the transfusion started.",initial:"Airway is patent. Breathing is fast with new wheezing. Pulse is rapid.",history:"Patient was receiving packed red blood cells for anemia. No symptoms were present before the transfusion.",exam:"Facial flushing, chills, hives, chest discomfort, and flank pain. Patient appears anxious and ill.",vitals:"HR 128, BP 86/50, RR 28, SpO₂ 90%, Temp 101.5°F.",additional:"Symptoms are temporally associated with the active transfusion.",diagnosis:"Acute Blood Transfusion Reaction",management:["Stop the transfusion immediately while maintaining appropriate IV access with compatible fluid per protocol.","Support airway, breathing, and circulation.","Treat anaphylaxis, shock, or other reaction features as indicated.","Preserve transfusion information and notify the receiving facility."],teaching:["A sudden reaction during transfusion should be assumed serious until proven otherwise.","Treatment depends on the reaction phenotype, but stopping the transfusion is immediate."],stages:[{title:"Stage 2",text:"Hypotension worsens and respiratory distress increases. Hives spread and the patient becomes confused."},{title:"Stage 3",text:"The patient develops severe shock with inadequate respirations and is nearing cardiac arrest.",critical:true}]},
{condition:"Severe Hypothermia",type:"Environmental",difficulty:"Critical Care Paramedic",dispatch:"Medic 1, respond to a remote outdoor location for a {age}-year-old {sex} found after prolonged cold exposure.",scene:"The patient has been moved to a sheltered area. Clothing is wet and partially frozen. The patient appears lifeless at first glance.",initial:"Patient is unresponsive. Breathing is extremely slow and shallow. A central pulse is faint and requires prolonged assessment to detect.",history:"Estimated exposure time is several hours in freezing conditions.",exam:"Skin is very cold. No shivering is present. Muscles are stiff. Handle the patient gently.",vitals:"HR 24 irregular, BP difficult to obtain, RR 4, SpO₂ unreliable, core Temp 78°F.",additional:"Monitor shows atrial fibrillation with frequent ventricular ectopy.",ecg:"Profound bradycardia with atrial fibrillation/ventricular irritability in severe hypothermia.",diagnosis:"Severe Hypothermia",management:["Confirm pulse and respirations carefully for an extended period.","Handle gently and keep the patient horizontal.","Remove wet clothing, prevent further heat loss, and begin appropriate active core rewarming.","Use warmed humidified oxygen and warmed IV fluids when available and indicated.","Follow hypothermic resuscitation/defibrillation guidance if arrest occurs."],teaching:["Severe hypothermia can mimic death.","Rough handling can precipitate ventricular dysrhythmias."],stages:[{title:"Stage 2",text:"The patient loses the detectable pulse and develops ventricular fibrillation during movement."},{title:"Stage 3",text:"Cardiac arrest continues in profound hypothermia; resuscitation and rewarming proceed under hypothermia-specific protocol.",critical:true}]},
{condition:"DIC",type:"Medical",difficulty:"Critical Care Paramedic",dispatch:"Medic 1, respond to a hospital transfer unit for a {age}-year-old {sex} with worsening bleeding and shock.",scene:"The patient is critically ill with oozing from multiple IV and puncture sites.",initial:"Airway is patent. Breathing is fast. Pulse is rapid and weak. Patient is confused.",history:"Patient is being treated for severe sepsis and has developed increasing bleeding over the last hour.",exam:"Diffuse bruising, petechiae, and persistent oozing from vascular-access sites. Skin is cool and mottled.",vitals:"HR 136, BP 74/40, RR 30, SpO₂ 94%.",additional:"Laboratory information provided for transport shows falling platelets and abnormal coagulation studies.",diagnosis:"Disseminated Intravascular Coagulation (DIC)",management:["Support ABCs and treat shock.","Control external bleeding where possible without causing additional trauma.","Continue treatment of the underlying cause and transport with appropriate blood-product support per critical-care plan."],teaching:["DIC causes simultaneous widespread clotting and consumption of clotting factors, leading to bleeding.","Sepsis, major trauma, burns, obstetric emergencies, and massive transfusion are important causes."],stages:[{title:"Stage 2",text:"Bleeding increases from IV sites and mucous membranes while BP remains critically low."},{title:"Stage 3",text:"The patient develops profound shock with worsening mental status and multisystem failure.",critical:true}]},
{condition:"Respiratory Failure",type:"Medical",difficulty:"Critical Care Paramedic",dispatch:"Medic 1, respond to a long-term care facility for a {age}-year-old {sex} with worsening respiratory distress and decreasing responsiveness.",scene:"The patient is upright in bed with staff providing oxygen. Respiratory effort is visibly tiring.",initial:"Airway is patent. Respirations are shallow and increasingly ineffective. Pulse is fast. Patient answers only with brief responses.",history:"Several days of respiratory illness with chronic lung disease.",exam:"Diffuse diminished breath sounds with scattered crackles. Accessory muscle use is becoming less pronounced as fatigue worsens.",vitals:"HR 124, BP 108/64, RR 18 shallow after previously being in the 30s, SpO₂ 82% despite oxygen.",additional:"Mental status is declining. If capnography is available, ventilation is inadequate with rising CO₂.",diagnosis:"Acute Respiratory Failure",management:["Recognize that decreasing respiratory rate may reflect fatigue, not improvement.","Provide escalating ventilatory support, including BVM/NIV/advanced airway as clinically appropriate.","Treat the underlying cause while maintaining oxygenation and ventilation."],teaching:["AMS is a major warning sign distinguishing respiratory failure from uncomplicated distress.","Work of breathing may decrease just before arrest because the patient is exhausted."],stages:[{title:"Stage 2",text:"The patient becomes minimally responsive with RR 10 and very poor tidal volume. SpO₂ falls to 74%."},{title:"Stage 3",text:"The patient stops breathing but still has a pulse, producing respiratory arrest.",critical:true}]}
];

const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function patientData(group){if(group==="Geriatric")return{age:Math.floor(Math.random()*26)+65,sex:rnd(["male","female"])};return{age:Math.floor(Math.random()*47)+18,sex:rnd(["male","female"])};}
function fill(t,p){return (t||"").replaceAll("{age}",p.age).replaceAll("{sex}",p.sex);}
function card(title,text,cls=""){return `<div class="card ${cls}"><h3>${title}</h3><p>${text}</p></div>`}
function list(items){return `<ul class="detail-list">${items.map(x=>`<li>${x}</li>`).join("")}</ul>`}
function generate(){
 const type=$("type").value,difficulty=$("difficulty").value,patient=$("patient").value,progression=$("progression").value,mode=$("mode").value;
 let pool=scenarios.filter(s=>s.difficulty===difficulty && (type==="Random"||s.type===type));
 const out=$("scenario");out.style.display="block";
 if(!pool.length){out.innerHTML=`<h2>Scenario</h2><div class="empty">There are no ${difficulty} ${type} scenarios in the current library yet. Choose Random or another type/difficulty.</div>`;return;}
 const s=rnd(pool),p=patientData(patient);out.innerHTML=`<h2>${mode==="FTO"?"FTO Scenario":"Student Scenario"}</h2><div class="meta"><span class="badge">${s.type}</span><span class="badge">${s.difficulty}</span><span class="badge">${patient}: ${p.age}</span><span class="badge">${progression}</span><span class="badge">${mode} Mode</span></div>`;
 out.innerHTML+=card("Dispatch",fill(s.dispatch,p),"dispatch")+card("Scene",fill(s.scene,p),"scene");
 if(mode==="FTO") renderFTO(out,s,p,progression); else renderStudent(out,s,p,progression);
}
function renderStudent(out,s,p,progression){
 const infos=[["Initial Assessment",s.initial],["History",s.history],["Physical Exam",s.exam],["Vital Signs",s.vitals]];
 if(s.ecg)infos.push(["ECG / Monitor",s.ecg]);
 if(s.additional)infos.push(["Additional Information",s.additional]);
 const ids=infos.map((_,i)=>`info-${Date.now()}-${i}`);
 out.insertAdjacentHTML("beforeend",`<div class="reveal-grid">${infos.map((x,i)=>`<button class="reveal-btn" data-target="${ids[i]}">Reveal ${x[0]}</button>`).join("")}</div>${infos.map((x,i)=>`<div id="${ids[i]}" class="card hidden-info"><h3>${x[0]}</h3><p>${fill(x[1],p)}</p></div>`).join("")}`);
 out.querySelectorAll(".reveal-btn").forEach(b=>b.addEventListener("click",()=>{const c=document.getElementById(b.dataset.target);c.style.display="block";b.classList.add("revealed");b.disabled=true;}));
 if(progression==="Dynamic"&&s.stages.length){
   out.insertAdjacentHTML("beforeend",`<h3>Scenario Progression</h3><div class="stage-controls">${s.stages.map((st,i)=>`<button class="stage-btn" data-stage="stage-${i}-${Date.now()}">Advance to ${st.title}</button>`).join("")}</div>`);
   const buttons=[...out.querySelectorAll(".stage-controls .stage-btn")];
   s.stages.forEach((st,i)=>{const id=buttons[i].dataset.stage;out.insertAdjacentHTML("beforeend",`<div id="${id}" class="card stage-card ${st.critical?"critical":""}" style="display:none"><h3>${st.title}</h3><p>${st.text}</p></div>`);buttons[i].addEventListener("click",()=>{document.getElementById(id).style.display="block";buttons[i].disabled=true;buttons[i].classList.add("revealed")})});
 }
 const did=`dx-${Date.now()}`;out.insertAdjacentHTML("beforeend",`<button class="diagnosis-btn" data-dx="${did}">REVEAL DIAGNOSIS & EXPECTED MANAGEMENT</button><div id="${did}" class="card diagnosis-card"><div class="diagnosis-title">${s.diagnosis}</div><div class="subheading">Expected Management</div>${list(s.management)}<div class="subheading">Teaching Points</div>${list(s.teaching)}</div>`);const db=out.querySelector(`[data-dx="${did}"]`);db.addEventListener("click",()=>{document.getElementById(did).style.display="block";db.style.display="none"});
}
function renderFTO(out,s,p,progression){
 out.insertAdjacentHTML("beforeend",`<div class="fto-title">INSTRUCTOR VIEW — ALL INFORMATION VISIBLE</div>${card("Intended Diagnosis",s.diagnosis,"diagnosis-card")}${card("Initial Assessment",fill(s.initial,p))}${card("History",fill(s.history,p))}${card("Physical Exam",fill(s.exam,p))}${card("Vital Signs",fill(s.vitals,p))}${s.ecg?card("ECG / Monitor",s.ecg):""}${s.additional?card("Additional Information",s.additional):""}`);
 if(progression==="Dynamic"&&s.stages.length){out.insertAdjacentHTML("beforeend",`<div class="subheading">Dynamic Progression</div>${s.stages.map(st=>card(st.title,st.text,`stage-card ${st.critical?"critical":""}`)).join("")}`)}
 out.insertAdjacentHTML("beforeend",`<div class="card"><h3>Expected Management</h3>${list(s.management)}<div class="subheading">Teaching Points</div>${list(s.teaching)}</div>`);
}
$("generate").addEventListener("click",generate);
</script>
</body>
