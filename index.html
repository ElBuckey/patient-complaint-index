<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMS Clinical Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        header {
            background: #18242f;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #e63946;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 6px 0 0;
            color: #b8c1c8;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .section {
            background: #18242f;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .section h2 {
            margin-top: 0;
            border-bottom: 1px solid #344451;
            padding-bottom: 10px;
        }

        .vitals {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #d5dce1;
        }

        select,
        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            background: #101820;
            color: white;
            border: 1px solid #4d5c68;
            border-radius: 6px;
            font-size: 16px;
        }

        select:focus,
        input:focus {
            outline: 2px solid #e63946;
            outline-offset: 1px;
        }

        .search-wrapper {
            position: relative;
        }

        .suggestions {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 4px);
            background: #101820;
            border: 1px solid #4d5c68;
            border-radius: 7px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 100;
        }

        .suggestion {
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid #293844;
        }

        .suggestion:last-child {
            border-bottom: none;
        }

        .suggestion:hover,
        .suggestion.active {
            background: #243442;
        }

        .suggestion-name {
            font-weight: bold;
        }

        .suggestion-category {
            margin-top: 3px;
            font-size: 12px;
            color: #8fa0ad;
        }

        .no-results {
            padding: 14px;
            color: #8fa0ad;
        }

        .quick-heading,
        .selected-heading {
            margin-top: 20px;
            margin-bottom: 9px;
            font-weight: bold;
        }

        .quick-picks {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-pill {
            width: auto;
            min-height: 36px;
            padding: 7px 12px;
            border: 1px solid #4d5c68;
            border-radius: 999px;
            background: #253542;
            color: white;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
        }

        .quick-pill:hover {
            background: #344957;
        }

        .quick-pill.selected {
            background: #e63946;
            border-color: #e63946;
            font-weight: bold;
        }

        .selected-findings {
            min-height: 55px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 8px;
            background: #101820;
            padding: 10px;
            border-radius: 7px;
        }

        .no-findings {
            padding: 7px 4px;
            color: #82909b;
        }

        .finding-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #344451;
            border-radius: 20px;
            padding: 7px 8px 7px 12px;
            font-size: 14px;
        }

        .remove-tag {
            width: 26px;
            height: 26px;
            padding: 0;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: 0;
            border-radius: 50%;
            background: #202e39;
            color: white;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }

        .remove-tag:hover {
            background: #e63946;
        }

        .analyze-button {
            width: 100%;
            min-height: 54px;
            border: none;
            border-radius: 8px;
            background: #e63946;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .analyze-button:hover {
            background: #c92f3b;
        }

        #results {
            display: none;
            margin-top: 20px;
        }

        .result-card {
            background: #101820;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .notice {
            font-size: 13px;
            color: #9caab5;
            text-align: center;
            line-height: 1.5;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .vitals {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 12px;
            }

            .section {
                padding: 15px;
            }
        }

        @media (max-width: 430px) {
            .vitals {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

<header>
    <h1>EMS Clinical Assistant</h1>
    <p>Clinical findings & differential reference</p>
</header>


<div class="container">

    <div class="section">

        <h2>Vitals</h2>

        <div class="vitals">

            <div>
                <label for="hr">Heart Rate</label>
                <select id="hr">
                    <option value="">Select</option>
                    <option value="tachycardic">Tachycardic / Fast</option>
                    <option value="normal">Normal</option>
                    <option value="bradycardic">Bradycardic / Slow</option>
                </select>
            </div>

            <div>
                <label for="bp">Blood Pressure</label>
                <select id="bp">
                    <option value="">Select</option>
                    <option value="hypotensive">Hypotensive / Low</option>
                    <option value="normal">Normal</option>
                    <option value="hypertensive">Hypertensive / High</option>
                </select>
            </div>

            <div>
                <label for="breathing">Breathing</label>
                <select id="breathing">
                    <option value="">Select</option>
                    <option value="fast">Fast</option>
                    <option value="normal">Normal</option>
                    <option value="slow">Slow</option>
                </select>
            </div>

            <div>
                <label for="o2">O₂</label>
                <select id="o2">
                    <option value="">Select</option>
                    <option value="normal">Normal</option>
                    <option value="low">Low</option>
                </select>
            </div>

            <div>
                <label for="temp">Temperature</label>
                <select id="temp">
                    <option value="">Select</option>
                    <option value="warm">Warm</option>
                    <option value="normal">Normal</option>
                    <option value="cool">Cool</option>
                </select>
            </div>

            <div>
                <label for="bgl">Blood Sugar</label>
                <select id="bgl">
                    <option value="">Select</option>
                    <option value="high">High</option>
                    <option value="normal">Normal</option>
                    <option value="low">Low</option>
                </select>
            </div>

        </div>

    </div>


    <div class="section">

        <h2>Clinical Findings</h2>

        <label for="findingSearch">
            Search signs, symptoms, or assessment findings
        </label>

        <div class="search-wrapper">

            <input
                type="text"
                id="findingSearch"
                placeholder="Example: JVD, wheezing, facial droop..."
                autocomplete="off"
            >

            <div id="suggestions" class="suggestions"></div>

        </div>


        <div class="quick-heading">
            Common Findings
        </div>

        <div class="quick-picks">

            <button class="quick-pill" type="button" data-finding="Chest Pain">
                Chest Pain
            </button>

            <button class="quick-pill" type="button" data-finding="Dyspnea">
                Dyspnea
            </button>

            <button class="quick-pill" type="button" data-finding="Altered Mental Status">
                AMS
            </button>

            <button class="quick-pill" type="button" data-finding="Syncope / Near Syncope">
                Syncope
            </button>

            <button class="quick-pill" type="button" data-finding="Seizure">
                Seizure
            </button>

            <button class="quick-pill" type="button" data-finding="Weakness">
                Weakness
            </button>

        </div>


        <div class="selected-heading">
            Selected Findings
        </div>

        <div id="selectedFindings" class="selected-findings">

            <span class="no-findings">
                No findings selected
            </span>

        </div>

    </div>


    <button
        type="button"
        id="analyzeButton"
        class="analyze-button"
    >
        ANALYZE FINDINGS
    </button>


    <div id="results" class="section">

        <h2>Clinical Considerations</h2>

        <div id="resultContent"></div>

    </div>


    <div class="notice">
        Educational clinical reference only. Not a substitute for local protocols,
        medical direction, or clinical judgment.
    </div>

</div>

            category: "Skin / General",
            aliases: [

                "tongue swelling",
                "lip swelling",
                "airway swelling"
            ]
        },

        {
            name: "Dry Skin",
            category: "Skin / General",
            aliases: [
                "dry"
            ]
        },

        {
            name: "Abdominal Tenderness",
            category: "Abdominal",
            aliases: [
                "tender abdomen",
                "abdominal tenderness"
            ]
        },

        {
            name: "Abdominal Distention",
            category: "Abdominal",
            aliases: [
                "distended abdomen",
                "abdominal distension"
            ]
        },

        {
            name: "Rigid Abdomen",
            category: "Abdominal",
            aliases: [
                "rigidity",
                "abdominal rigidity"
            ]
        },

        {
            name: "GI Bleeding",
            category: "Abdominal",
            aliases: [
                "hematemesis",
                "melena",
                "bloody stool",
                "vomiting blood"
            ]
        }

    ];


    let selectedFindings = [];

    let currentMatches = [];

    let highlightedIndex = -1;


    const searchInput =
        document.getElementById("findingSearch");

    const suggestions =
        document.getElementById("suggestions");

    const selectedContainer =
        document.getElementById("selectedFindings");

    const analyzeButton =
        document.getElementById("analyzeButton");

    const quickPills =
        document.querySelectorAll(".quick-pill");


    function normalizeText(text) {
        return text
            .toLowerCase()
            .trim();
    }


    function findingMatches(finding, query) {

        const searchableText = [
            finding.name,
            finding.category,
            ...finding.aliases
        ]
        .join(" ")
        .toLowerCase();

        return searchableText.includes(query);
    }


    function performSearch() {

        const query =
            normalizeText(searchInput.value);

        suggestions.innerHTML = "";
        highlightedIndex = -1;

        if (!query) {
            suggestions.style.display = "none";
            currentMatches = [];
            return;
        }

        currentMatches =
            findings.filter(finding => {

                return (
                    findingMatches(finding, query)
                    &&
                    !selectedFindings.includes(finding.name)
                );

            });

        if (currentMatches.length === 0) {

            const noResults =
                document.createElement("div");

            noResults.className =
                "no-results";

            noResults.textContent =
                "No matching findings";

            suggestions.appendChild(noResults);

            suggestions.style.display =
                "block";

            return;
        }

        currentMatches
            .slice(0, 12)
            .forEach((finding, index) => {

                const item =
                    document.createElement("div");

                item.className =
                    "suggestion";

                const name =
                    document.createElement("div");

                name.className =
                    "suggestion-name";

                name.textContent =
                    finding.name;

                const category =
                    document.createElement("div");

                category.className =
                    "suggestion-category";

                category.textContent =
                    finding.category;

                item.appendChild(name);
                item.appendChild(category);

                item.addEventListener(
                    "mousedown",
                    function(event) {

                        event.preventDefault();

                        addFinding(
                            finding.name
                        );

                    }
                );

                suggestions.appendChild(item);

            });

        suggestions.style.display =
            "block";
    }


    searchInput.addEventListener(
        "input",
        performSearch
    );


    searchInput.addEventListener(
        "focus",
        function() {

            if (
                searchInput.value.trim() !== ""
            ) {
                performSearch();
            }

        }
    );


    searchInput.addEventListener(
        "keydown",
        function(event) {

            const items =
                suggestions.querySelectorAll(
                    ".suggestion"
                );

            if (event.key === "ArrowDown") {

                event.preventDefault();

                highlightedIndex++;

                if (
                    highlightedIndex >= items.length
                ) {
                    highlightedIndex = 0;
                }

                updateHighlightedItem(items);
            }

            else if (
                event.key === "ArrowUp"
            ) {

                event.preventDefault();

                highlightedIndex--;

                if (
                    highlightedIndex < 0
                ) {
                    highlightedIndex =
                        items.length - 1;
                }

                updateHighlightedItem(items);
            }

            else if (
                event.key === "Enter"
            ) {

                if (
                    highlightedIndex >= 0
                    &&
                    currentMatches[
                        highlightedIndex
                    ]
                ) {

                    event.preventDefault();

                    addFinding(
                        currentMatches[
                            highlightedIndex
                        ].name
                    );

                }

                else if (
                    currentMatches.length === 1
                ) {

                    event.preventDefault();

                    addFinding(
                        currentMatches[0].name
                    );

                }

            }

            else if (
                event.key === "Escape"
            ) {

                suggestions.style.display =
                    "none";

            }

        }
    );


    function updateHighlightedItem(items) {

        items.forEach(
            (item, index) => {

                item.classList.toggle(
                    "active",
                    index === highlightedIndex
                );

            }
        );

    }


    quickPills.forEach(button => {

        button.addEventListener(
            "click",
            function() {

                const finding =
                    button.dataset.finding;

                if (
                    selectedFindings.includes(finding)
                ) {
                    removeFinding(finding);
                }

                else {
                    addFinding(finding);
                }

            }
        );

    });


    function addFinding(name) {

        if (
            !selectedFindings.includes(name)
        ) {
            selectedFindings.push(name);
        }

        searchInput.value = "";

        suggestions.innerHTML = "";

        suggestions.style.display =
            "none";

        renderSelectedFindings();
        updateQuickPills();
    }


    function removeFinding(name) {

        selectedFindings =
            selectedFindings.filter(
                finding =>
                    finding !== name
            );

        renderSelectedFindings();
        updateQuickPills();
    }


    function updateQuickPills() {

        quickPills.forEach(button => {

            const finding =
                button.dataset.finding;

            button.classList.toggle(
                "selected",
                selectedFindings.includes(finding)
            );

        });

    }


    function renderSelectedFindings() {

        selectedContainer.innerHTML = "";

        if (
            selectedFindings.length === 0
        ) {

            const empty =
                document.createElement("span");

            empty.className =
                "no-findings";

            empty.textContent =
                "No findings selected";

            selectedContainer.appendChild(
                empty
            );

            return;
        }

        selectedFindings.forEach(
            findingName => {

                const tag =
                    document.createElement("div");

                tag.className =
                    "finding-tag";

                const label =
                    document.createElement("span");

                label.textContent =
                    findingName;

                const removeButton =
                    document.createElement("button");

                removeButton.type =
                    "button";

                removeButton.className =
                    "remove-tag";

                removeButton.textContent =
                    "×";

                removeButton.setAttribute(
                    "aria-label",
                    "Remove " + findingName
                );

                removeButton.addEventListener(
                    "click",
                    function() {

                        removeFinding(
                            findingName
                        );

                    }
                );

                tag.appendChild(label);
                tag.appendChild(removeButton);

                selectedContainer.appendChild(
                    tag
                );

            }
        );

    }


    document.addEventListener(
        "mousedown",
        function(event) {

            if (
                !event.target.closest(
                    ".search-wrapper"
                )
            ) {

                suggestions.style.display =
                    "none";

            }

        }
    );


    analyzeButton.addEventListener(
        "click",
        analyzePatient
    );


    function analyzePatient() {

        const hr =
            document.getElementById(
                "hr"
            ).value;

        const bp =
            document.getElementById(
                "bp"
            ).value;

        const breathing =
            document.getElementById(
                "breathing"
            ).value;

        const o2 =
            document.getElementById(
                "o2"
            ).value;

        const temp =
            document.getElementById(
                "temp"
            ).value;

        const bgl =
            document.getElementById(
                "bgl"
            ).value;

        const results =
            document.getElementById(
                "results"
            );

        const content =
            document.getElementById(
                "resultContent"
            );

        results.style.display =
            "block";

        if (
            !hr &&
            !bp &&
            !breathing &&
            !o2 &&
            !temp &&
            !bgl &&
            selectedFindings.length === 0
        ) {

            content.innerHTML = `
                <div class="result-card">
                    Select at least one vital or clinical finding.
                </div>
            `;

            return;
        }

        const vitalDescriptions = [];

        if (hr)
            vitalDescriptions.push(
                "Heart Rate: " + hr
            );

        if (bp)
            vitalDescriptions.push(
                "Blood Pressure: " + bp
            );

        if (breathing)
            vitalDescriptions.push(
                "Breathing: " + breathing
            );

        if (o2)
            vitalDescriptions.push(
                "O₂: " + o2
            );

        if (temp)
            vitalDescriptions.push(
                "Temperature: " + temp
            );

        if (bgl)
            vitalDescriptions.push(
                "Blood Sugar: " + bgl
            );

        content.innerHTML = `
            <div class="result-card">

                <strong>
                    Current Inputs
                </strong>

                <p>
                    ${
                        vitalDescriptions.length
                            ?
                            vitalDescriptions.join(
                                "<br>"
                            )
                            :
                            "No vitals selected."
                    }
                </p>

                <strong>
                    Clinical Findings
                </strong>

                <p>
                    ${
                        selectedFindings.length
                            ?
                            selectedFindings.join(
                                ", "
                            )
                            :
                            "None selected."
                    }
                </p>

                <p>
                    Differential engine coming next.
                </p>

            </div>
        `;

    }

</script>

</body>

</html>
